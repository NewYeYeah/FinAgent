name: us-a1-factorgraph-parity-families

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/us_a1_factor_materialization.py"
      - "tests/test_us_a1_factor_materialization.py"
      - "tests/test_us_a1_factor_parity_families.py"
      - ".github/workflows/us-a1-factorgraph-parity-families.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family-parity:
    name: A0 parity (${{ matrix.family }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        family:
          - reversal
          - momentum
          - range_mean
          - return_volatility
          - volume_surprise
          - close_location
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Run family parity
        run: |
          uv run --frozen pytest -q \
            tests/test_us_a1_factor_parity_families.py -k "${{ matrix.family }}"
