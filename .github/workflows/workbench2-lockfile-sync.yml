name: workbench2-lockfile-sync

on:
  push:
    branches:
      - codex/workbench2-agent-workspace
    paths:
      - workspace/package.json
      - .github/workflows/workbench2-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/workbench2-agent-workspace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workspace/package-lock.json
      - name: Generate lockfile only
        working-directory: workspace
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- workspace/package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/package-lock.json
          git commit -m "chore(workbench): sync query lockfile"
          git push origin HEAD:codex/workbench2-agent-workspace
