name: a54-apply

on:
  push:
    branches:
      - feature/a5-workspace-integration

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'stage A5-4 apply workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/a5-workspace-integration
          fetch-depth: 0

      - name: Materialize verified A5-4 product patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          expected = [
              ('part00.txt', '2ba6636adface8b722f9ea4e4dedd820be8a843cca9f41c43d781cbf76467f54'),
              ('part01.txt', '13f04b18588b9ad44ebca7d081400f55c5b03e5c2271c0e1ada2f284f17a2f4a'),
              ('part02.txt', 'c9a31c25aba4f68072b043a2ce1cc6b72707b8ce0e312379546b757f524d13a2'),
              ('part03.txt', '2f658afddfaac7e24dd649fbc3c0ddb2d4453a1df3703a881d6d157141eea454'),
              ('part04.txt', 'd86d0f601e59c5359ba63ff5ed0adb282770234d3368d5974ed91e6056c6724d'),
              ('part05.txt', '0f42c174d611743eed31f9a752be9c4fea54e6bac45cea2d3846137cf49c5110'),
              ('part06a.txt', '99e4577981845cdcbd0962b8cdfe63fe6a913bdbe1cc9879244b5db88545e654'),
              ('part06b.txt', '2e9ea09bb094f8951340950f33208bd755bdd30fc154e39f3501f896341eaeaf'),
              ('part07.txt', '332ca4a70c8b818be3102657ba5be0533122c9cb79484871b733862d14a59604'),
          ]
          values = []
          for name, digest_expected in expected:
              raw = (Path('tools/a54_payload') / name).read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              print(name, len(raw), digest)
              if digest != digest_expected:
                  raise SystemExit(f'{name} digest mismatch: {digest}')
              values.append(raw.decode('utf-8').strip())
          payload = ''.join(values)
          patch = gzip.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(patch).hexdigest()
          expected_patch = '4dc4411c2821ea3db6067a3b58eea367b68940091578d8d9ce82f32a9107c5e0'
          if digest != expected_patch:
              raise SystemExit(f'A5-4 patch digest mismatch: {digest}')
          Path('/tmp/a54.patch').write_bytes(patch)
          print(f'patch_bytes={len(patch)} sha256={digest}')
          PY

      - name: Apply A5-4 product delivery
        run: |
          git apply --check /tmp/a54.patch
          git apply /tmp/a54.patch
          git rm -rf tools/a54_payload
          git diff --check

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "visualization: implement A5-4 reserve evidence workspace"
          git push origin HEAD:feature/a5-workspace-integration
