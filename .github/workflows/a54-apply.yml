name: a54-apply

on:
  push:
    branches:
      - feature/a5-workspace-integration

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'stage A5-4 apply workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/a5-workspace-integration
          fetch-depth: 0

      - name: Materialize verified A5-4 product patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          parts = [
              Path('tools/a54_payload') / f'part{i:02d}.txt'
              for i in range(8)
          ]
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          patch = gzip.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(patch).hexdigest()
          expected = '4dc4411c2821ea3db6067a3b58eea367b68940091578d8d9ce82f32a9107c5e0'
          if digest != expected:
              raise SystemExit(f'A5-4 patch digest mismatch: {digest}')
          Path('/tmp/a54.patch').write_bytes(patch)
          print(f'patch_bytes={len(patch)} sha256={digest}')
          PY

      - name: Apply A5-4 product delivery
        run: |
          git apply --check /tmp/a54.patch
          git apply /tmp/a54.patch
          git rm -rf tools/a54_payload
          git diff --check

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "visualization: implement A5-4 reserve evidence workspace"
          git push origin HEAD:feature/a5-workspace-integration
