name: workbench2-market-factor-typing-fix

on:
  push:
    branches:
      - codex/workbench2-market-factor-intelligence
    paths:
      - .github/workflows/workbench2-market-factor-typing-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/workbench2-market-factor-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply typing-only patch
        run: python .github/workbench2_market_factor_typing_fix.py
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/finagent/visualization/research_workspace.py src/finagent/visualization/market_factor_intelligence.py
          git commit -m "fix(workbench): narrow market factor projection types"
          git rm .github/workbench2_market_factor_typing_fix.py .github/workflows/workbench2-market-factor-typing-fix.yml
          git commit -m "chore(workbench): remove typing fix workflow"
          git push origin HEAD:codex/workbench2-market-factor-intelligence
