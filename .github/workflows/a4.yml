name: a4-ashare-portfolio-validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/data/local_ashare_inference_adapter.py"
      - "src/finagent/data/ashare_close.py"
      - "src/finagent/models/alpha/ashare_frozen.py"
      - "src/finagent/backtest/ashare_portfolio.py"
      - "scripts/run_ashare_portfolio_validation.py"
      - "tests/test_ashare_portfolio_validation_a4.py"
      - "configs/execution/ashare_portfolio_validation_a4.example.toml"
      - ".github/workflows/a4.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/data/local_ashare_inference_adapter.py"
      - "src/finagent/data/ashare_close.py"
      - "src/finagent/models/alpha/ashare_frozen.py"
      - "src/finagent/backtest/ashare_portfolio.py"
      - "scripts/run_ashare_portfolio_validation.py"
      - "tests/test_ashare_portfolio_validation_a4.py"
      - "configs/execution/ashare_portfolio_validation_a4.example.toml"
      - ".github/workflows/a4.yml"

jobs:
  a4:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,local-parquet]"
      - name: A4 tests
        env:
          PYTHONUTF8: "1"
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q
          tests/test_ashare_portfolio_validation_a4.py
          tests/test_ashare_execution_a3.py
          tests/test_ashare_execution_edge_cases_a3.py
          tests/test_ashare_robust_research_a26.py
      - name: Compile A4 entry points
        run: |
          python -m py_compile src/finagent/data/local_ashare_inference_adapter.py src/finagent/data/ashare_close.py src/finagent/models/alpha/ashare_frozen.py src/finagent/backtest/ashare_portfolio.py scripts/run_ashare_portfolio_validation.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,local-parquet]"
      - name: Lint production surface
        run: |
          ruff check \
            src/finagent/data/local_ashare_inference_adapter.py \
            src/finagent/data/ashare_close.py \
            src/finagent/models/alpha/ashare_frozen.py \
            src/finagent/backtest/ashare_portfolio.py \
            scripts/run_ashare_portfolio_validation.py \
            --select E4,E7,E9,F
      - name: Type check
        run: |
          mypy \
            src/finagent/data/local_ashare_inference_adapter.py \
            src/finagent/data/ashare_close.py \
            src/finagent/models/alpha/ashare_frozen.py \
            src/finagent/backtest/ashare_portfolio.py
