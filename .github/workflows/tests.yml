name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Targeted static typing baseline
        run: |
          mypy \
            src/finagent/domain/metrics.py \
            src/finagent/domain/trading.py \
            src/finagent/domain/universe.py \
            src/finagent/research/programs.py \
            src/finagent/models/alpha/primitives.py
      - name: Coverage floor
        run: pytest --cov=finagent --cov-report=term --cov-fail-under=50
      - name: Package build and dependency consistency
        run: |
          python -m build
          python -m pip check
