name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  windows-pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONUTF8: "1"
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Project-wide critical static checks
        run: ruff check src tests scripts --select E9,F63,F7,F82
      - name: Hardened 1.0 release-surface lint
        run: |
          ruff check \
            src/finagent/domain/metrics.py \
            src/finagent/domain/trading.py \
            src/finagent/domain/universe.py \
            src/finagent/models/alpha/primitives.py \
            src/finagent/research/generated_feature_eval.py \
            src/finagent/services/portfolio.py \
            tests/test_quant_core_hardening_v101.py \
            --select E4,E7,E9,F
      - name: Real-market M1 surface lint
        run: |
          ruff check \
            src/finagent/data/ingestion \
            src/finagent/backtest/market_study.py \
            src/finagent/backtest/timed.py \
            tests/test_market_data_ingestion_m1.py \
            tests/test_market_study_m1.py \
            tests/test_timed_backtest_phase2.py \
            tests/test_provider_layer_us_first.py \
            scripts/pull_market_data.py \
            scripts/validate_market_data.py \
            scripts/compare_market_providers.py \
            scripts/run_market_backtest.py
      - name: Local A-share Parquet surface lint
        run: |
          ruff check \
            src/finagent/data/local_ashare.py \
            src/finagent/data/local_ashare_adapter.py \
            src/finagent/data/local_ashare_certification.py \
            src/finagent/data/local_ashare_compat.py \
            src/finagent/data/local_ashare_research_adapter.py \
            src/finagent/data/local_ashare_research_certification.py \
            src/finagent/data/local_ashare_freeze.py \
            src/finagent/data/ashare_supplemental.py \
            src/finagent/data/ashare_supplemental_master.py \
            src/finagent/research/ashare_universe.py \
            src/finagent/research/panel_feature_materializer.py \
            src/finagent/research/ashare_factor_acceptance.py \
            src/finagent/research/resilient_candidate_generator.py \
            tests/test_local_ashare_data_layer_v126.py \
            tests/test_ashare_freeze_supplemental_v127.py \
            tests/test_ashare_legacy_anomaly_v127.py \
            tests/test_ashare_suspension_session_semantics_v127.py \
            tests/test_ashare_factor_acceptance_a2.py \
            scripts/certify_local_ashare_data.py \
            scripts/freeze_local_ashare_data.py \
            scripts/run_local_ashare_research_smoke.py \
            scripts/run_local_ashare_factor_research.py \
            --select E4,E7,E9,F
      - name: Agent robustness and observability lint
        run: |
          ruff check \
            src/finagent/agents/observability.py \
            src/finagent/agents/generation_checkpoint.py \
            src/finagent/agents/llm_feature.py \
            src/finagent/agents/providers/openai_compatible.py \
            src/finagent/agents/providers/config.py \
            src/finagent/research/factor_quant_discovery.py \
            src/finagent/research/resilient_candidate_generator.py \
            tests/test_agent_generation_robustness_observability.py \
            --select E4,E7,E9,F
      - name: Agent real-market 1.2/1.2.1 surface lint
        run: |
          ruff check \
            src/finagent/models/alpha/generated.py \
            src/finagent/research/agent_market.py \
            src/finagent/research/market_validation.py \
            tests/test_agent_market_research_v120.py \
            tests/test_agent_market_validation_v121.py \
            scripts/run_agent_market_research.py \
            scripts/validate_agent_market_research.py \
            --select E4,E7,E9,F
      - name: Targeted static typing baseline
        run: |
          mypy \
            src/finagent/domain/metrics.py \
            src/finagent/domain/trading.py \
            src/finagent/domain/universe.py \
            src/finagent/research/programs.py \
            src/finagent/models/alpha/primitives.py \
            src/finagent/models/alpha/generated.py \
            src/finagent/agents/observability.py \
            src/finagent/agents/generation_checkpoint.py \
            src/finagent/agents/llm_feature.py \
            src/finagent/agents/providers/openai_compatible.py \
            src/finagent/agents/providers/config.py \
            src/finagent/research/agent_market.py \
            src/finagent/research/market_validation.py \
            src/finagent/research/factor_quant_discovery.py \
            src/finagent/research/resilient_candidate_generator.py \
            src/finagent/services/portfolio.py \
            src/finagent/data/ingestion \
            src/finagent/data/local_ashare_freeze.py \
            src/finagent/data/local_ashare_research_adapter.py \
            src/finagent/data/local_ashare_research_certification.py \
            src/finagent/data/ashare_supplemental.py \
            src/finagent/backtest/market_study.py
      - name: Coverage floor
        run: pytest --cov=finagent --cov-report=term --cov-fail-under=50
      - name: Package build and dependency consistency
        run: |
          python -m build
          python -m pip check
