name: us-a0-run-evidence-orchestrator

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/us_agent_value_run_orchestration.py"
      - "scripts/orchestrate_us_a0_pilot_run_evidence.py"
      - "tests/test_us_a0_run_orchestration.py"
      - "docs/guides/us-a0-pilot-run-evidence-orchestration.md"
      - ".github/workflows/us-a0-run-evidence-orchestrator.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/research/us_agent_value_run_orchestration.py"
      - "scripts/orchestrate_us_a0_pilot_run_evidence.py"
      - "tests/test_us_a0_run_orchestration.py"
      - "docs/guides/us-a0-pilot-run-evidence-orchestration.md"
      - ".github/workflows/us-a0-run-evidence-orchestrator.yml"

permissions:
  contents: read

jobs:
  run-evidence:
    name: US-A0 resume-safe run evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Focused regression
        run: |
          uv run --frozen pytest -q \
            tests/test_us_a0_run_orchestration.py \
            tests/test_us_a0_assembly.py \
            tests/test_us_a0_runtime_orchestration.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/research/us_agent_value_run_orchestration.py \
            scripts/orchestrate_us_a0_pilot_run_evidence.py \
            tests/test_us_a0_run_orchestration.py
          uv run --frozen mypy --strict \
            src/finagent/research/us_agent_value_run_orchestration.py \
            scripts/orchestrate_us_a0_pilot_run_evidence.py
          uv run --frozen python -m py_compile \
            src/finagent/research/us_agent_value_run_orchestration.py \
            scripts/orchestrate_us_a0_pilot_run_evidence.py
