name: close-streaming-source-v1-docs

on:
  push:
    branches: [rt-streaming-source-harness-v1]
    paths:
      - "scripts/_close_streaming_source_v1_docs.py"

permissions:
  contents: write

jobs:
  close-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt-streaming-source-harness-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update completion docs
        run: python scripts/_close_streaming_source_v1_docs.py
      - name: Documentation governance
        run: python scripts/check_docs.py
      - name: Commit completion docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guides/realtime-source-development-model.md docs/development/changelog.md
          git diff --cached --exit-code && exit 0
          git commit -m "Document Streaming Source Harness v1 closure"
          git push origin HEAD:rt-streaming-source-harness-v1
