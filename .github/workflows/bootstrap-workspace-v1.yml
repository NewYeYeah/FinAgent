name: bootstrap-workspace-v1

on:
  push:
    branches:
      - workspace-v1

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Finalize active documentation
        run: python tools/finalize_workspace_v1.py
      - name: Install and test API
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workspace]"
          python -m pytest -q tests/test_workspace_api_v1.py tests/test_visualization_semantic_contract_v2.py
          ruff check src/finagent/visualization/workspace_api.py scripts/run_workspace.py tests/test_workspace_api_v1.py --select E4,E7,E9,F
          mypy src/finagent/visualization/workspace_api.py
      - name: Generate lockfile and test frontend
        working-directory: workspace
        run: |
          npm install
          npm run typecheck
          npm run test
          npm run build
      - name: Commit finalized V1 sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/finalize_workspace_v1.py .github/workflows/bootstrap-workspace-v1.yml
          git add workspace/package-lock.json docs/testing/testing.md docs/guides/research-visualization.md
          git commit -m "visualization: finalize Workspace V1 lockfile and acceptance docs"
          git push origin HEAD:workspace-v1
