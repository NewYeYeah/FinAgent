name: finalize-workspace-v1-release

on:
  push:
    branches:
      - workspace-v1-release

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace-v1-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply idempotent release finalization
        run: python tools/finalize_workspace_v1_release.py
      - name: Install and verify Python API
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workspace]"
          python -m pytest -q \
            tests/test_workspace_api_v1.py \
            tests/test_visualization_semantic_contract_v2.py \
            tests/test_research_visualization.py \
            tests/test_research_ui_app.py
          ruff check \
            src/finagent/visualization/workspace_api.py \
            scripts/run_workspace.py \
            tests/test_workspace_api_v1.py \
            --select E4,E7,E9,F
          mypy src/finagent/visualization/workspace_api.py
          python -m pip check
      - name: Lock and verify frontend
        working-directory: workspace
        run: |
          npm install
          npm run typecheck
          npm run test
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Commit clean release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            tools/finalize_workspace_v1_release.py \
            .github/workflows/finalize-workspace-v1-release.yml \
            tools/finalize_workspace_v1.py \
            tools/patch_workspace_v1_frontend.py \
            .github/workflows/bootstrap-workspace-v1.yml \
            .github/workflows/patch-workspace-v1.yml
          git add -A
          git commit -m "visualization: finalize tested Workspace V1 release"
          git push origin HEAD:workspace-v1-release
