name: us-i0-universe-candidates

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/data/us_universe_candidates.py"
      - "scripts/select_us_i0_universe_candidates.py"
      - "scripts/select_us_i0_mapped_candidates.py"
      - "tests/test_us_i0_universe_candidates.py"
      - "docs/status.toml"
      - "docs/development/changelog.md"
      - "docs/guides/us-instrument-mapping.md"
      - ".github/workflows/us-i0-universe-candidates.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/data/us_universe_candidates.py"
      - "scripts/select_us_i0_universe_candidates.py"
      - "scripts/select_us_i0_mapped_candidates.py"
      - "tests/test_us_i0_universe_candidates.py"
      - "docs/status.toml"
      - "docs/development/changelog.md"
      - "docs/guides/us-instrument-mapping.md"
      - ".github/workflows/us-i0-universe-candidates.yml"

permissions:
  contents: read

jobs:
  candidate-selection:
    name: US-I0 deterministic universe candidate selection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Candidate-selection regression
        run: uv run --frozen pytest -q tests/test_us_i0_universe_candidates.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/data/us_universe_candidates.py \
            scripts/select_us_i0_universe_candidates.py \
            scripts/select_us_i0_mapped_candidates.py \
            tests/test_us_i0_universe_candidates.py
          uv run --frozen mypy --strict \
            src/finagent/data/us_universe_candidates.py \
            scripts/select_us_i0_universe_candidates.py \
            scripts/select_us_i0_mapped_candidates.py
          uv run --frozen python -m py_compile \
            src/finagent/data/us_universe_candidates.py \
            scripts/select_us_i0_universe_candidates.py \
            scripts/select_us_i0_mapped_candidates.py
