name: v2-dev-export

on:
  push:
    branches:
      - feature/visualization-v2-complete

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package source snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('.').resolve()
          target = Path('/tmp/FinAgent-v2-source.zip')
          ignored = {'.git', 'node_modules', 'dist', '.pytest_cache', '.mypy_cache', '.ruff_cache'}
          with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(root)
                  if any(part in ignored for part in rel.parts):
                      continue
                  archive.write(path, rel.as_posix())
          print(target)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FinAgent-v2-source
          path: /tmp/FinAgent-v2-source.zip
          if-no-files-found: error
          retention-days: 1
