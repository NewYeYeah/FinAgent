name: a5p2-apply

on:
  push:
    branches:
      - feature/a5-one-shot-runner

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'stage A5-2 apply workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/a5-one-shot-runner
          fetch-depth: 0

      - name: Materialize verified A5-2 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          payload = ''.join(
              path.read_text(encoding='utf-8').strip()
              for path in sorted(Path('tools/a5p2_payload').glob('part*.txt'))
          )
          patch = gzip.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(patch).hexdigest()
          expected = 'ef1e5fa39670cc7619701e6ed52c095710aae4ce6dd8ddc18407b2c468146bc0'
          if digest != expected:
              raise SystemExit(f'A5-2 patch digest mismatch: {digest}')
          Path('/tmp/a5p2.patch').write_bytes(patch)
          print(f'patch_bytes={len(patch)} sha256={digest}')
          PY

      - name: Apply A5-2 product delivery
        run: |
          git apply --check /tmp/a5p2.patch
          git apply /tmp/a5p2.patch
          git rm -rf tools/a5p2_payload
          git diff --check

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "governance: implement A5-2 one-shot reserve runner"
          git push origin HEAD:feature/a5-one-shot-runner
