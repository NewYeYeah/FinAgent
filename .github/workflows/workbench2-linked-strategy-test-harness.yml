name: workbench2-linked-strategy-test-harness

on:
  push:
    branches: [codex/workbench2-linked-strategy-analytics]
    paths:
      - "scripts/_workbench2_linked_strategy_test_patch.py"
      - ".github/workflows/workbench2-linked-strategy-test-harness.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/workbench2-linked-strategy-analytics
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/_workbench2_linked_strategy_test_patch.py
      - name: Commit test harness changes
        run: |
          git rm -f scripts/_workbench2_linked_strategy_test_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(workbench): adapt strategy analytics TanStack harness"
          git push origin HEAD:codex/workbench2-linked-strategy-analytics
