name: apply-a3-bse-lot-fix

on:
  push:
    branches:
      - a3-bse-lot-hotfix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3-bse-lot-hotfix
          fetch-depth: 0
      - name: Apply BSE lot patch
        run: |
          python tools/apply_a3_bse_lot_fix.py
          python -m py_compile src/finagent/services/ashare_execution.py
      - name: Commit source/test/docs changes
        run: |
          if git diff --quiet -- src/finagent/services/ashare_execution.py tests/test_ashare_execution_a3.py docs/guides/ashare-execution.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/finagent/services/ashare_execution.py tests/test_ashare_execution_a3.py docs/guides/ashare-execution.md
          git commit -m "execution: correct BSE minimum-quantity increments"
          git push origin HEAD:a3-bse-lot-hotfix
