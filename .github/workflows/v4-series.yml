name: v4-series

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/backtest/__init__.py"
      - "src/finagent/backtest/strategy_decision_*.py"
      - "scripts/materialize_strategy_decision_series.py"
      - "tests/test_strategy_decision_series_v40.py"
      - ".github/workflows/v4-series.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/backtest/__init__.py"
      - "src/finagent/backtest/strategy_decision_*.py"
      - "scripts/materialize_strategy_decision_series.py"
      - "tests/test_strategy_decision_series_v40.py"
      - ".github/workflows/v4-series.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check \
            src/finagent/backtest/__init__.py \
            src/finagent/backtest/strategy_decision_series.py \
            src/finagent/backtest/strategy_decision_alpha.py \
            scripts/materialize_strategy_decision_series.py \
            tests/test_strategy_decision_series_v40.py \
            --select E4,E7,E9,F
      - name: Type check
        run: |
          mypy \
            src/finagent/backtest/__init__.py \
            src/finagent/backtest/strategy_decision_series.py \
            src/finagent/backtest/strategy_decision_alpha.py \
            scripts/materialize_strategy_decision_series.py
      - name: Dependency consistency
        run: python -m pip check

  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: V4-0 acceptance
        env:
          PYTHONUTF8: "1"
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/test_strategy_decision_series_v40.py
