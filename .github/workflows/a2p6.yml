name: a2p6-robust-research

on:
  # Keep the historical A2.6 regression on every main integration, but do not
  # block unrelated pull requests such as the U.S. minute data line.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/ashare_robust_program.py"
      - "src/finagent/research/factor_feedback_v3.py"
      - "scripts/run_local_ashare_robust_research.py"
      - "tests/test_ashare_robust_research_a26.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/a2p6.yml"
  workflow_dispatch:

jobs:
  robust-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,local-parquet]"
      - name: Test A2.6 program, gate, feedback and replay
        run: python -m pytest -q tests/test_ashare_robust_research_a26.py
      - name: Lint A2.6 surface
        run: |
          ruff check \
            src/finagent/research/ashare_robust_program.py \
            src/finagent/research/factor_feedback_v3.py \
            scripts/run_local_ashare_robust_research.py \
            tests/test_ashare_robust_research_a26.py \
            --select E4,E7,E9,F
      - name: Compile entry points
        run: |
          python -m py_compile \
            src/finagent/research/ashare_robust_program.py \
            src/finagent/research/factor_feedback_v3.py \
            scripts/run_local_ashare_robust_research.py
