name: us-r1-final-evidence

on:
  pull_request:
    paths:
      - "src/finagent/research/us_r1_evaluation_policy.py"
      - "src/finagent/research/us_r1_observation_io.py"
      - "src/finagent/research/us_r1_statistics.py"
      - "src/finagent/research/us_r1_pipeline.py"
      - "src/finagent/research/us_r1_final.py"
      - "src/finagent/research/us_r1_final_validation.py"
      - "src/finagent/research/us_r1_review.py"
      - "scripts/freeze_us_r1_statistical_evaluation_policy.py"
      - "scripts/assemble_us_r1_alpha_evidence.py"
      - "scripts/review_us_r1_alpha_gate.py"
      - "tests/test_us_r1_final_evidence.py"
      - "docs/guides/us-r1-robust-intraday-alpha-gate.md"
      - ".github/workflows/us-r1-final-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  us-r1-final-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Focused regression
        run: |
          uv run --frozen pytest -q \
            tests/test_us_r1_final_evidence.py \
            tests/test_us_r1_preregistration_gate.py \
            tests/test_us_r1_contract_validation.py \
            tests/test_us_r1_walkforward_materialization.py \
            tests/test_us_b0_materialization.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/research/us_r1_evaluation_policy.py \
            src/finagent/research/us_r1_observation_io.py \
            src/finagent/research/us_r1_statistics.py \
            src/finagent/research/us_r1_pipeline.py \
            src/finagent/research/us_r1_final.py \
            src/finagent/research/us_r1_final_validation.py \
            src/finagent/research/us_r1_review.py \
            scripts/freeze_us_r1_statistical_evaluation_policy.py \
            scripts/assemble_us_r1_alpha_evidence.py \
            scripts/review_us_r1_alpha_gate.py
          uv run --frozen mypy --strict \
            src/finagent/research/us_r1_evaluation_policy.py \
            src/finagent/research/us_r1_observation_io.py \
            src/finagent/research/us_r1_statistics.py \
            src/finagent/research/us_r1_pipeline.py \
            src/finagent/research/us_r1_final.py \
            src/finagent/research/us_r1_final_validation.py \
            src/finagent/research/us_r1_review.py \
            scripts/freeze_us_r1_statistical_evaluation_policy.py \
            scripts/assemble_us_r1_alpha_evidence.py \
            scripts/review_us_r1_alpha_gate.py
          uv run --frozen python -m py_compile \
            src/finagent/research/us_r1_evaluation_policy.py \
            src/finagent/research/us_r1_observation_io.py \
            src/finagent/research/us_r1_statistics.py \
            src/finagent/research/us_r1_pipeline.py \
            src/finagent/research/us_r1_final.py \
            src/finagent/research/us_r1_final_validation.py \
            src/finagent/research/us_r1_review.py \
            scripts/freeze_us_r1_statistical_evaluation_policy.py \
            scripts/assemble_us_r1_alpha_evidence.py \
            scripts/review_us_r1_alpha_gate.py
