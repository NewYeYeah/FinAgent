name: a5-mypy-fix

on:
  push:
    branches:
      - feature/a5-reserve-seal

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'stage A5 mypy fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/a5-reserve-seal
          fetch-depth: 0
      - name: Apply strict numeric coercion fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/finagent/research/ashare_reserve.py')
          s = p.read_text(encoding='utf-8')
          old = '''def _string(value: object, name: str) -> str:\n    return require_non_empty(str(value), name)\n\n\ndef _semantic_replay_payload'''
          new = '''def _string(value: object, name: str) -> str:\n    return require_non_empty(str(value), name)\n\n\ndef _float_value(value: object, name: str) -> float:\n    if isinstance(value, bool) or not isinstance(value, (int, float, str)):\n        raise TypeError(f"{name} must be a numeric JSON value")\n    result = float(value)\n    if not math.isfinite(result):\n        raise ValueError(f"{name} must be finite")\n    return result\n\n\ndef _int_value(value: object, name: str) -> int:\n    if isinstance(value, bool) or not isinstance(value, (int, float, str)):\n        raise TypeError(f"{name} must be an integer JSON value")\n    if isinstance(value, float) and not value.is_integer():\n        raise ValueError(f"{name} must be an integer")\n    result = int(value)\n    if isinstance(value, str) and str(result) != value.strip():\n        raise ValueError(f"{name} must be an integer")\n    return result\n\n\ndef _semantic_replay_payload'''
          old2 = '''        if [float(value) for value in _sequence(spec.get("selected_weights"), "A4 selected_weights")] != expected_weights:\n            raise ValueError("A4 selected weights drifted from A2.6")\n        if [int(value) for value in _sequence(spec.get("selected_directions"), "A4 selected_directions")] != expected_directions:\n            raise ValueError("A4 selected directions drifted from A2.6")\n'''
          new2 = '''        if [\n            _float_value(value, "A4 selected weight")\n            for value in _sequence(spec.get("selected_weights"), "A4 selected_weights")\n        ] != expected_weights:\n            raise ValueError("A4 selected weights drifted from A2.6")\n        if [\n            _int_value(value, "A4 selected direction")\n            for value in _sequence(spec.get("selected_directions"), "A4 selected_directions")\n        ] != expected_directions:\n            raise ValueError("A4 selected directions drifted from A2.6")\n'''
          if old not in s or old2 not in s:
              raise SystemExit('expected A5-1 source anchors not found')
          p.write_text(s.replace(old, new).replace(old2, new2), encoding='utf-8')
          PY
          git diff --check
      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/finagent/research/ashare_reserve.py
          git commit -m "fix: tighten A5 reserve numeric validation"
          git push origin HEAD:feature/a5-reserve-seal
