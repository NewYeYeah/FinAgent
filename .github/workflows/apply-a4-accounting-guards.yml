name: apply-a4-accounting-guards

on:
  push:
    branches:
      - a4-execution-aware-portfolio-validation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a4-execution-aware-portfolio-validation
          fetch-depth: 0
      - name: Apply accounting guards
        run: |
          python tools/apply_a4_accounting_guards.py
          python -m py_compile \
            src/finagent/backtest/ashare_portfolio.py \
            scripts/run_ashare_portfolio_validation.py \
            tests/test_ashare_portfolio_validation_a4.py
      - name: Commit source and test changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts tests
          git commit -m "backtest: tighten A4 accounting and source lineage"
          git push origin HEAD:a4-execution-aware-portfolio-validation
