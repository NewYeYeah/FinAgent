name: eng0-lock-bootstrap

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".python-version"
      - ".github/workflows/eng0-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  resolve-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Resolve Python lock
        run: |
          uv --version
          uv lock
      - name: Persist lock if changed
        run: |
          if [ -n "$(git status --porcelain -- uv.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "build: resolve Python dependencies with uv"
            git push origin HEAD:main
          else
            echo "uv.lock already matches pyproject.toml"
          fi
