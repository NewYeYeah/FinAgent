name: apply-a3-type-fix

on:
  push:
    branches:
      - a3-ashare-execution-semantics

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3-ashare-execution-semantics
          fetch-depth: 0
      - name: Apply type-narrowing patch
        run: |
          python tools/apply_a3_type_fix.py
          python -m py_compile \
            src/finagent/data/ashare_execution.py \
            src/finagent/services/ashare_execution.py
      - name: Commit source changes when needed
        run: |
          if git diff --quiet -- src/finagent/data/ashare_execution.py src/finagent/services/ashare_execution.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/finagent/data/ashare_execution.py src/finagent/services/ashare_execution.py
          git commit -m "execution: fix A3 static type narrowing"
          git push origin HEAD:a3-ashare-execution-semantics
