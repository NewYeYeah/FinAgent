name: v31-newfiles

on:
  push:
    branches:
      - feature/v3-agent-index

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'stage V3-1 newfiles workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3-agent-index
          fetch-depth: 0

      - name: Materialize verified V3-1 new files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          expected = [
              ('part00.txt', '374c7a33c7467eb35627868b30e0add4f3aa0c3ca1fe444961291f2697204a9e'),
              ('part01.txt', 'b4ee318dd1af08c51c65b68034b00791a56916ee7c68787d8cba65e0b001ec8d'),
              ('part02a.txt', '0f4bdb08c8ea523e0eac961d2431e5c7416cd3f4ce34e60720116a13c0339851'),
              ('part02b.txt', 'edc32c5a634a59f8abd7888765f66aef5c0263e3647f1a6f375ad91ca8967ba0'),
          ]
          values = []
          for name, expected_digest in expected:
              raw = (Path('tools/v31_newfiles') / name).read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if digest != expected_digest:
                  raise SystemExit(f'{name} digest mismatch: {digest}')
              values.append(raw.decode('utf-8').strip())
          archive = base64.b64decode(''.join(values))
          digest = hashlib.sha256(archive).hexdigest()
          expected_archive = '45863bb2e22cf71db96ba73fe0682b6364fecb7b7c40c7c8801d2303e9a60c82'
          if digest != expected_archive:
              raise SystemExit(f'V3-1 new-file archive digest mismatch: {digest}')
          Path('/tmp/v31-newfiles.tar.gz').write_bytes(archive)
          print(f'archive_bytes={len(archive)} sha256={digest}')
          PY

      - name: Extract V3-1 new files
        run: |
          tar -xzf /tmp/v31-newfiles.tar.gz
          git rm -rf tools/v31_newfiles
          git diff --check
          test -f src/finagent/visualization/agent_index.py
          test -f tests/test_agent_index_v3.py

      - name: Commit V3-1 new files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "visualization: add V3-1 index contract files"
          git push origin HEAD:feature/v3-agent-index
