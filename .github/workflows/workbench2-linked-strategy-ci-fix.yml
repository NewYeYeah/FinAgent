name: workbench2-linked-strategy-ci-fix

on:
  push:
    branches: [codex/workbench2-linked-strategy-analytics]
    paths:
      - "scripts/_linked_strategy_ci_fix.py"
      - ".github/workflows/workbench2-linked-strategy-ci-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/workbench2-linked-strategy-analytics
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/_linked_strategy_ci_fix.py
      - name: Commit test fixes
        run: |
          git rm -f scripts/_linked_strategy_ci_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(workbench): settle linked strategy TanStack harnesses"
          git push origin HEAD:codex/workbench2-linked-strategy-analytics
