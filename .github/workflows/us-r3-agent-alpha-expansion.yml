name: us-r3-agent-alpha-expansion

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/us_a1_factor_materialization.py"
      - "src/finagent/research/us_a1_factor_panel_materialization.py"
      - "src/finagent/research/us_r3_agent_boundary.py"
      - "src/finagent/research/us_r3_alpha_catalog.py"
      - "src/finagent/research/us_r3_usability.py"
      - "src/finagent/agents/r3_*.py"
      - "scripts/check_us_r3_agent_runtime.py"
      - "tests/test_us_r3_agent_runtime.py"
      - "scripts/check_us_r3_alpha_usability.py"
      - "tests/test_us_r3_usability.py"
      - "scripts/freeze_us_r3_research_iteration.py"
      - "tests/test_us_a1_factor_panel_materialization.py"
      - "tests/test_us_r3_agent_alpha_expansion.py"
      - "docs/guides/us-a1-factorgraph-materialization.md"
      - "docs/guides/us-r3-agent-alpha-expansion.md"
      - "docs/development/current-plan.md"
      - "docs/development/changelog.md"
      - "docs/status.toml"
      - ".github/workflows/us-r3-agent-alpha-expansion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-alpha-expansion:
    name: US-R3 numeric and scoped runtime acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Panel semantics and Agent boundary
        run: |
          uv run --frozen pytest -q \
            tests/test_us_r3_agent_runtime.py \
            tests/test_us_a1_factor_panel_materialization.py \
            tests/test_us_r3_usability.py \
            tests/test_us_r3_agent_alpha_expansion.py
      - name: A1 and R2 identity predecessor regression
        run: |
          uv run --frozen pytest -q \
            tests/test_us_a1_factor_graph.py \
            tests/test_us_a1_factor_materialization.py \
            tests/test_us_r2_candidate_robustness_collisions.py
      - name: Freeze data-blind bundle twice
        run: |
          PYTHONPATH=src uv run --frozen python scripts/freeze_us_r3_research_iteration.py --output us-r3-a.json
          PYTHONPATH=src uv run --frozen python scripts/freeze_us_r3_research_iteration.py --output us-r3-b.json
          cmp us-r3-a.json us-r3-b.json
      - name: Offline capability loop and zero-call resume
        run: |
          PYTHONPATH=src uv run --frozen python scripts/check_us_r3_agent_runtime.py --output-root us-r3-runtime-smoke
          PYTHONPATH=src uv run --frozen python scripts/check_us_r3_agent_runtime.py --output-root us-r3-runtime-smoke
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/agents/r3_contracts.py \
            src/finagent/agents/r3_ledger.py \
            src/finagent/agents/r3_runtime.py \
            scripts/check_us_r3_agent_runtime.py \
            tests/test_us_r3_agent_runtime.py \
            src/finagent/research/us_r3_usability.py \
            scripts/check_us_r3_alpha_usability.py \
            tests/test_us_r3_usability.py \
            src/finagent/research/us_a1_factor_materialization.py \
            src/finagent/research/us_a1_factor_panel_materialization.py \
            src/finagent/research/us_r3_agent_boundary.py \
            src/finagent/research/us_r3_alpha_catalog.py \
            scripts/freeze_us_r3_research_iteration.py \
            tests/test_us_a1_factor_panel_materialization.py \
            tests/test_us_r3_agent_alpha_expansion.py
          uv run --frozen mypy --strict --follow-imports=skip \
            src/finagent/agents/r3_contracts.py \
            src/finagent/agents/r3_ledger.py \
            src/finagent/agents/r3_runtime.py \
            scripts/check_us_r3_agent_runtime.py \
            src/finagent/research/us_r3_usability.py \
            scripts/check_us_r3_alpha_usability.py \
            src/finagent/research/us_a1_factor_materialization.py \
            src/finagent/research/us_a1_factor_panel_materialization.py \
            src/finagent/research/us_r3_agent_boundary.py \
            src/finagent/research/us_r3_alpha_catalog.py \
            scripts/freeze_us_r3_research_iteration.py
          uv run --frozen python -m py_compile \
            src/finagent/agents/r3_contracts.py \
            src/finagent/agents/r3_ledger.py \
            src/finagent/agents/r3_runtime.py \
            scripts/check_us_r3_agent_runtime.py \
            src/finagent/research/us_r3_usability.py \
            scripts/check_us_r3_alpha_usability.py \
            src/finagent/research/us_a1_factor_materialization.py \
            src/finagent/research/us_a1_factor_panel_materialization.py \
            src/finagent/research/us_r3_agent_boundary.py \
            src/finagent/research/us_r3_alpha_catalog.py \
            scripts/freeze_us_r3_research_iteration.py
      - name: Explicit no-MT5 research boundary
        run: |
          ! grep -R "^import MetaTrader5\|^from MetaTrader5" \
            src/finagent/agents/r3_contracts.py \
            src/finagent/agents/r3_ledger.py \
            src/finagent/agents/r3_runtime.py \
            scripts/check_us_r3_agent_runtime.py \
            src/finagent/research/us_r3_usability.py \
            scripts/check_us_r3_alpha_usability.py \
            src/finagent/research/us_a1_factor_panel_materialization.py \
            src/finagent/research/us_r3_agent_boundary.py \
            src/finagent/research/us_r3_alpha_catalog.py \
            scripts/freeze_us_r3_research_iteration.py
      - name: Documentation governance
        run: uv run --frozen pytest -q tests/test_docs_governance.py
