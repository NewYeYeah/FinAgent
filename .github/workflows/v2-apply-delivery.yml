name: v2-apply-delivery

on:
  push:
    branches:
      - feature/visualization-v2-complete

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visualization-v2-complete
          fetch-depth: 0

      - name: Materialize delivery patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          payload = ''.join(
              path.read_text(encoding='utf-8').strip()
              for path in sorted(Path('tools/v2_delivery_payload').glob('*.txt'))
          )
          patch = gzip.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(patch).hexdigest()
          expected = '379079d8fbecc70ae01930d24b7e6f24abc9d54266d77488986f9ace0c555c1c'
          if digest != expected:
              raise SystemExit(f'payload digest mismatch: {digest}')
          Path('/tmp/finagent-v2-delivery.patch').write_bytes(patch)
          print(f'patch bytes={len(patch)} sha256={digest}')
          PY

      - name: Apply V2 product files
        run: |
          git apply --check /tmp/finagent-v2-delivery.patch
          git apply /tmp/finagent-v2-delivery.patch
          # GITHUB_TOKEN cannot push workflow-file mutations. Keep permanent and
          # temporary workflow files unchanged in this transport commit; they are
          # finalized immediately afterwards through the authorized GitHub connector.
          git checkout HEAD -- \
            .github/workflows/workspace.yml \
            .github/workflows/v2-dev-export.yml \
            .github/workflows/v2-apply-delivery.yml
          git rm -rf tools/v2_delivery_payload
          git diff --check

      - name: Commit product delivery tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "visualization: deliver V2 pre-reserve governance cockpit"
          git push origin HEAD:feature/visualization-v2-complete
