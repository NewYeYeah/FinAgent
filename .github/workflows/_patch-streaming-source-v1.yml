name: patch-streaming-source-v1

on:
  push:
    branches: [rt-streaming-source-harness-v1]
    paths:
      - "scripts/_patch_streaming_source_v1.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt-streaming-source-harness-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch
        run: python scripts/_patch_streaming_source_v1.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/finagent/realtime/sources.py src/finagent/realtime/database_replay.py src/finagent/realtime/mt5_source.py src/finagent/realtime/__init__.py
          git diff --cached --exit-code && exit 0
          git commit -m "Fix streaming source strict typing and lint"
          git push origin HEAD:rt-streaming-source-harness-v1
