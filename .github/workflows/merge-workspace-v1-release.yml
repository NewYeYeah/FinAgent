name: merge-workspace-v1-release

on:
  push:
    branches:
      - workspace-v1-release

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-merge:
    if: ${{ github.actor == 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace-v1-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workspace/package-lock.json
      - name: Verify clean final tree
        run: |
          test -f workspace/package-lock.json
          test ! -e tools/finalize_workspace_v1_release.py
          test ! -e .github/workflows/finalize-workspace-v1-release.yml
          test ! -e tools/finalize_workspace_v1.py
          test ! -e tools/patch_workspace_v1_frontend.py
          test ! -e .github/workflows/bootstrap-workspace-v1.yml
          test ! -e .github/workflows/patch-workspace-v1.yml
      - name: Verify API and semantic contracts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workspace]"
          python -m pytest -q \
            tests/test_workspace_api_v1.py \
            tests/test_visualization_semantic_contract_v2.py \
            tests/test_research_visualization.py \
            tests/test_research_ui_app.py
          ruff check src/finagent/visualization/workspace_api.py scripts/run_workspace.py tests/test_workspace_api_v1.py --select E4,E7,E9,F
          mypy src/finagent/visualization/workspace_api.py
          python -m pip check
      - name: Verify frontend final tree
        working-directory: workspace
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build
      - name: Remove one-shot merge workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/merge-workspace-v1-release.yml
          git commit -m "build: remove one-shot Workspace V1 merge gate"
          git push origin HEAD:workspace-v1-release
      - name: Mark ready and merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head workspace-v1-release --state open --json number --jq '.[0].number')
          test -n "$pr_number"
          gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY"
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
