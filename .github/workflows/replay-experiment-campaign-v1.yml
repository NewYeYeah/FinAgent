name: replay-experiment-campaign-v1

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/replay_experiment_campaign.py"
      - "src/finagent/research/streaming_experiment_bridge.py"
      - "tests/test_replay_experiment_campaign_v1.py"
      - "tests/test_streaming_research_evidence_bridge_v1.py"
      - "scripts/smoke_replay_experiment_campaign.py"
      - "scripts/run_replay_experiment_campaign.py"
      - "docs/guides/replay-experiment-campaign.md"
      - "docs/development/changelog.md"
      - ".github/workflows/replay-experiment-campaign-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/research/replay_experiment_campaign.py"
      - "src/finagent/research/streaming_experiment_bridge.py"
      - "tests/test_replay_experiment_campaign_v1.py"
      - "scripts/smoke_replay_experiment_campaign.py"
      - "scripts/run_replay_experiment_campaign.py"
      - "docs/guides/replay-experiment-campaign.md"
      - "docs/development/changelog.md"
      - ".github/workflows/replay-experiment-campaign-v1.yml"

permissions:
  contents: read

jobs:
  replay-experiment-campaign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Focused replay campaign regressions
        run: |
          uv run --frozen pytest -q \
            tests/test_replay_experiment_campaign_v1.py \
            tests/test_streaming_research_evidence_bridge_v1.py \
            tests/test_streaming_feature_strategy_v1.py \
            tests/test_streaming_source_harness_v1.py \
            tests/test_us_b0_materialization.py \
            tests/test_us_b0_evaluation_core.py \
            tests/test_us_a0_evaluation_bridge.py \
            tests/test_us_r1_walkforward_materialization.py
      - name: Deterministic replay campaign smoke
        run: uv run --frozen python scripts/smoke_replay_experiment_campaign.py
      - name: Authority boundary guard
        run: |
          python - <<'PY'
          from pathlib import Path

          campaign = Path("src/finagent/research/replay_experiment_campaign.py").read_text(encoding="utf-8").lower()
          for forbidden in ("order_send(", "symbol_select(", "market_book_add(", "metatrader5"):
              if forbidden in campaign:
                  raise SystemExit(f"provider/broker mutation leaked into campaign: {forbidden}")
          for claim in (
              '"certification_authority": true',
              '"research_authority": true',
              '"agent_value_gate_authority": true',
              '"alpha_authority": true',
              '"execution_authority": true',
              '"stage_exit_authority": true',
          ):
              if claim in campaign:
                  raise SystemExit(f"authority escalation leaked into campaign: {claim}")
          operator = Path("scripts/materialize_us_b0_baselines.py").read_text(encoding="utf-8")
          if "_require_us_b0_stage_authority" not in operator:
              raise SystemExit("formal US-B0 operator lost its stage-authority guard")
          local_operator = Path("scripts/run_replay_experiment_campaign.py").read_text(encoding="utf-8")
          if "materialize_us_b0_baselines" in local_operator:
              raise SystemExit("engineering campaign operator must not call/import formal US-B0 operator")
          PY
      - name: Local bounded operator import/help smoke
        run: uv run --frozen python scripts/run_replay_experiment_campaign.py --help
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/research/replay_experiment_campaign.py \
            src/finagent/research/streaming_experiment_bridge.py \
            scripts/smoke_replay_experiment_campaign.py \
            scripts/run_replay_experiment_campaign.py \
            tests/test_replay_experiment_campaign_v1.py
          uv run --frozen mypy --strict \
            src/finagent/research/replay_experiment_campaign.py \
            src/finagent/research/streaming_experiment_bridge.py \
            scripts/smoke_replay_experiment_campaign.py
          uv run --frozen python -m py_compile \
            src/finagent/research/replay_experiment_campaign.py \
            src/finagent/research/streaming_experiment_bridge.py \
            scripts/smoke_replay_experiment_campaign.py \
            scripts/run_replay_experiment_campaign.py
