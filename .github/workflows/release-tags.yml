name: release-tags

on:
  push:
    branches: [main]
    paths:
      - "docs/status.toml"
      - "scripts/sync_release_tags.py"
      - ".github/workflows/release-tags.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/status.toml"
      - "scripts/sync_release_tags.py"
      - "tests/test_release_tag_sync.py"
      - ".github/workflows/release-tags.yml"

permissions:
  contents: write

jobs:
  release-tag-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Release tag regression
        run: python -m pytest -q tests/test_release_tag_sync.py
      - name: Configure release tag identity
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Materialize accepted release tags
        if: github.event_name == 'push'
        run: python scripts/sync_release_tags.py --apply
      - name: Verify accepted release tags
        if: github.event_name == 'pull_request'
        run: python scripts/sync_release_tags.py
