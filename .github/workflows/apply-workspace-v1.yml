name: apply-workspace-v1

on:
  push:
    branches:
      - workspace-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize Workspace V1
        run: python tools/apply_workspace_v1.py

      - name: Install and test Python surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workspace]"
          python -m pytest -q \
            tests/test_visualization_semantic_contract_v2.py \
            tests/test_workspace_api_v1.py
          ruff check \
            src/finagent/workspace \
            scripts/run_workspace.py \
            tests/test_workspace_api_v1.py \
            --select E4,E7,E9,F
          mypy src/finagent/workspace

      - name: Install, test and build React Workspace
        working-directory: workspace
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/apply_workspace_v1.py .github/workflows/apply-workspace-v1.yml
          git rm -rf tools/workspace_payload
          git add -A
          git commit -m "visualization: deliver Workspace V1"
          git push origin HEAD:workspace-v1
