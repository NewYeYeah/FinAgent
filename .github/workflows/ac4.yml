name: ac4-requirement-compliance

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/runtime/initial_requirement_compliance.py"
      - "configs/acceptance/ashare_initial_requirement_compliance_ac4.toml"
      - "scripts/run_initial_requirement_compliance_audit.py"
      - "tests/test_initial_requirement_compliance_ac4.py"
      - "docs/development/changelog-a-c4.md"
      - "docs/development/roadmap-v4.0.md"
      - "docs/testing/ac4-initial-requirement-compliance.md"
      - ".github/workflows/ac4.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/runtime/initial_requirement_compliance.py"
      - "configs/acceptance/ashare_initial_requirement_compliance_ac4.toml"
      - "scripts/run_initial_requirement_compliance_audit.py"
      - "tests/test_initial_requirement_compliance_ac4.py"
      - "docs/development/changelog-a-c4.md"
      - "docs/development/roadmap-v4.0.md"
      - "docs/testing/ac4-initial-requirement-compliance.md"
      - ".github/workflows/ac4.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Contract tests
        env:
          PYTHONUTF8: "1"
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/test_initial_requirement_compliance_ac4.py
      - name: Generate audit artifacts
        run: |
          python scripts/run_initial_requirement_compliance_audit.py \
            configs/acceptance/ashare_initial_requirement_compliance_ac4.toml \
            --git-sha "$GITHUB_SHA" \
            --json-report /tmp/ashare_initial_requirement_compliance_ac4.json \
            --markdown-report /tmp/ashare_initial_requirement_compliance_ac4.md
      - name: Compile
        run: python -m py_compile src/finagent/runtime/initial_requirement_compliance.py scripts/run_initial_requirement_compliance_audit.py
      - name: Ruff
        run: ruff check src/finagent/runtime/initial_requirement_compliance.py scripts/run_initial_requirement_compliance_audit.py tests/test_initial_requirement_compliance_ac4.py --select E4,E7,E9,F
      - name: Mypy
        run: mypy --follow-imports=silent src/finagent/runtime/initial_requirement_compliance.py
      - name: Dependency consistency
        run: python -m pip check
