name: us-d2-corporate-action-authority

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/data/minute_transform/action_authority.py"
      - "src/finagent/data/minute_transform/__init__.py"
      - "tests/test_us_d2_corporate_action_authority.py"
      - "docs/status.toml"
      - "docs/guides/us-minute-corporate-actions.md"
      - ".github/workflows/us-d2-corporate-action-authority.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/data/minute_transform/action_authority.py"
      - "src/finagent/data/minute_transform/__init__.py"
      - "tests/test_us_d2_corporate_action_authority.py"
      - "docs/status.toml"
      - "docs/guides/us-minute-corporate-actions.md"
      - ".github/workflows/us-d2-corporate-action-authority.yml"

permissions:
  contents: read

jobs:
  action-authority:
    name: US-D2 corporate-action research authority
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Corporate-action authority regression
        run: uv run --frozen pytest -q tests/test_us_d2_corporate_action_authority.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/data/minute_transform/action_authority.py \
            src/finagent/data/minute_transform/__init__.py \
            tests/test_us_d2_corporate_action_authority.py
          uv run --frozen mypy --strict src/finagent/data/minute_transform/action_authority.py
          uv run --frozen python -m py_compile src/finagent/data/minute_transform/action_authority.py
