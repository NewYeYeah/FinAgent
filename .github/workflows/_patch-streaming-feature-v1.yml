name: patch-streaming-feature-v1

on:
  push:
    branches: [rt-streaming-feature-strategy-v1]
    paths:
      - "scripts/_patch_streaming_feature_v1.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt-streaming-feature-strategy-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch
        run: python scripts/_patch_streaming_feature_v1.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_streaming_feature_strategy_v1.py
          git diff --cached --exit-code && exit 0
          git commit -m "Harden streaming feature integration tests"
          git push origin HEAD:rt-streaming-feature-strategy-v1
