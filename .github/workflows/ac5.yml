name: ac5-historical-v1-freeze

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/runtime/ashare_historical_v1_freeze.py"
      - "src/finagent/runtime/ashare_historical_v1_freeze_lineage.py"
      - "configs/acceptance/ashare_historical_v1_freeze.example.toml"
      - "scripts/freeze_ashare_historical_v1.py"
      - "tests/test_ashare_historical_v1_freeze_ac5.py"
      - "tests/test_ashare_historical_v1_freeze_lineage.py"
      - "docs/development/changelog-a-c5.md"
      - "docs/testing/ac5-historical-v1-freeze.md"
      - ".github/workflows/ac5.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/runtime/ashare_historical_v1_freeze.py"
      - "src/finagent/runtime/ashare_historical_v1_freeze_lineage.py"
      - "configs/acceptance/ashare_historical_v1_freeze.example.toml"
      - "scripts/freeze_ashare_historical_v1.py"
      - "tests/test_ashare_historical_v1_freeze_ac5.py"
      - "tests/test_ashare_historical_v1_freeze_lineage.py"
      - "docs/development/changelog-a-c5.md"
      - "docs/testing/ac5-historical-v1-freeze.md"
      - ".github/workflows/ac5.yml"

jobs:
  freeze-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Contract tests
        env:
          PYTHONUTF8: "1"
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q \
            tests/test_ashare_historical_v1_freeze_ac5.py \
            tests/test_ashare_historical_v1_freeze_lineage.py
      - name: Compile
        run: |
          python -m py_compile \
            src/finagent/runtime/ashare_historical_v1_freeze.py \
            src/finagent/runtime/ashare_historical_v1_freeze_lineage.py \
            scripts/freeze_ashare_historical_v1.py
      - name: Ruff
        run: |
          ruff check \
            src/finagent/runtime/ashare_historical_v1_freeze.py \
            src/finagent/runtime/ashare_historical_v1_freeze_lineage.py \
            scripts/freeze_ashare_historical_v1.py \
            tests/test_ashare_historical_v1_freeze_ac5.py \
            tests/test_ashare_historical_v1_freeze_lineage.py \
            --select E4,E7,E9,F
      - name: Mypy
        run: |
          mypy --follow-imports=silent \
            src/finagent/runtime/ashare_historical_v1_freeze.py \
            src/finagent/runtime/ashare_historical_v1_freeze_lineage.py
      - name: CLI import smoke
        run: python scripts/freeze_ashare_historical_v1.py --help
      - name: Dependency consistency
        run: python -m pip check
