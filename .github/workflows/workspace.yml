name: workspace-v2

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/application/**"
      - "src/finagent/data/market_bar_series.py"
      - "src/finagent/domain/market_bars.py"
      - "src/finagent/visualization/**"
      - "scripts/run_workspace.py"
      - "scripts/run_workbench_control.py"
      - "scripts/run_workbench_control.ps1"
      - "scripts/run_local_ashare_factor_research.py"
      - "scripts/run_local_ashare_robust_research.py"
      - "scripts/run_ashare_portfolio_validation.py"
      - "scripts/materialize_local_ashare_market_bars.py"
      - "scripts/export_workspace_review_bundle.py"
      - "workspace/**"
      - "tests/test_workspace_api_v1.py"
      - "tests/test_workspace_api_v2.py"
      - "tests/test_workspace_reserve_a54.py"
      - "tests/test_workbench_deep_links_v33.py"
      - "tests/test_workbench_stream_v34.py"
      - "tests/test_workbench_foundation_v35.py"
      - "tests/test_strategy_explorer_v42.py"
      - "tests/test_strategy_explorer_optional_dependency_v42.py"
      - "tests/test_factor_tearsheet_v43.py"
      - "tests/test_factor_tearsheet_authority_v43.py"
      - "tests/test_portfolio_execution_v44.py"
      - "tests/test_linked_analytics_acceptance_v45.py"
      - "tests/test_historical_workbench_operations_ac1.py"
      - "tests/test_market_bar_series_ac2.py"
      - "pyproject.toml"
      - ".github/workflows/workspace.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/application/**"
      - "src/finagent/data/market_bar_series.py"
      - "src/finagent/domain/market_bars.py"
      - "src/finagent/visualization/**"
      - "scripts/run_workspace.py"
      - "scripts/run_workbench_control.py"
      - "scripts/run_workbench_control.ps1"
      - "scripts/run_local_ashare_factor_research.py"
      - "scripts/run_local_ashare_robust_research.py"
      - "scripts/run_ashare_portfolio_validation.py"
      - "scripts/materialize_local_ashare_market_bars.py"
      - "scripts/export_workspace_review_bundle.py"
      - "workspace/**"
      - "tests/test_workspace_api_v1.py"
      - "tests/test_workspace_api_v2.py"
      - "tests/test_workspace_reserve_a54.py"
      - "tests/test_workbench_deep_links_v33.py"
      - "tests/test_workbench_stream_v34.py"
      - "tests/test_workbench_foundation_v35.py"
      - "tests/test_strategy_explorer_v42.py"
      - "tests/test_strategy_explorer_optional_dependency_v42.py"
      - "tests/test_factor_tearsheet_v43.py"
      - "tests/test_factor_tearsheet_authority_v43.py"
      - "tests/test_portfolio_execution_v44.py"
      - "tests/test_linked_analytics_acceptance_v45.py"
      - "tests/test_historical_workbench_operations_ac1.py"
      - "tests/test_market_bar_series_ac2.py"
      - "pyproject.toml"
      - ".github/workflows/workspace.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Workspace API
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workspace,local-parquet]"
      - name: Test Workspace API
        env:
          PYTHONUTF8: "1"
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/test_workspace_api_v1.py tests/test_workspace_api_v2.py tests/test_workspace_reserve_a54.py tests/test_visualization_semantic_contract_v2.py tests/test_visualization_semantic_a2_compat.py tests/test_agent_index_v3.py tests/test_workbench_deep_links_v33.py tests/test_workbench_stream_v34.py tests/test_workbench_foundation_v35.py tests/test_strategy_explorer_v42.py tests/test_strategy_explorer_optional_dependency_v42.py tests/test_factor_tearsheet_v43.py tests/test_factor_tearsheet_authority_v43.py tests/test_portfolio_execution_v44.py tests/test_linked_analytics_acceptance_v45.py tests/test_historical_workbench_operations_ac1.py tests/test_market_bar_series_ac2.py
      - name: Compile entry points
        run: python -m py_compile src/finagent/domain/market_bars.py src/finagent/data/market_bar_series.py src/finagent/application/ashare_research_workflows.py src/finagent/application/ashare_portfolio_workflow.py src/finagent/application/control_services.py src/finagent/visualization/agent_projection.py src/finagent/visualization/agent_index.py src/finagent/visualization/workspace_api.py src/finagent/visualization/workspace_v2.py src/finagent/visualization/reserve_projection.py src/finagent/visualization/workbench_api.py src/finagent/visualization/workbench_control_api.py src/finagent/visualization/historical_command_catalog.py src/finagent/visualization/historical_workbench_control_api.py src/finagent/visualization/workbench_links.py src/finagent/visualization/workbench_streams.py src/finagent/visualization/strategy_explorer.py src/finagent/visualization/factor_tearsheet.py src/finagent/visualization/factor_tearsheet_routes.py src/finagent/visualization/portfolio_execution.py src/finagent/visualization/portfolio_execution_routes.py src/finagent/visualization/linked_analytics_acceptance.py src/finagent/visualization/linked_analytics_acceptance_routes.py scripts/run_workspace.py scripts/run_workbench_control.py scripts/run_local_ashare_factor_research.py scripts/run_local_ashare_robust_research.py scripts/run_ashare_portfolio_validation.py scripts/materialize_local_ashare_market_bars.py scripts/export_workspace_review_bundle.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workspace/package-lock.json
      - name: Install frontend
        working-directory: workspace
        run: npm ci
      - name: Type check
        working-directory: workspace
        run: npm run typecheck
      - name: Unit tests
        working-directory: workspace
        run: npm run test
      - name: Production build
        working-directory: workspace
        run: npm run build
      - name: Install Chromium
        working-directory: workspace
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        working-directory: workspace
        run: npm run e2e

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workspace,local-parquet]"
      - name: Lint
        run: |
          ruff check \
            src/finagent/domain/market_bars.py \
            src/finagent/data/market_bar_series.py \
            src/finagent/application/ashare_research_workflows.py \
            src/finagent/application/ashare_portfolio_workflow.py \
            src/finagent/application/control_services.py \
            src/finagent/visualization/agent_projection.py \
            src/finagent/visualization/agent_index.py \
            src/finagent/visualization/workspace_api.py \
            src/finagent/visualization/workspace_v2.py \
            src/finagent/visualization/reserve_projection.py \
            src/finagent/visualization/workbench_api.py \
            src/finagent/visualization/workbench_control_api.py \
            src/finagent/visualization/historical_command_catalog.py \
            src/finagent/visualization/historical_workbench_control_api.py \
            src/finagent/visualization/workbench_links.py \
            src/finagent/visualization/workbench_streams.py \
            src/finagent/visualization/strategy_explorer.py \
            src/finagent/visualization/factor_tearsheet.py \
            src/finagent/visualization/factor_tearsheet_routes.py \
            src/finagent/visualization/portfolio_execution.py \
            src/finagent/visualization/portfolio_execution_routes.py \
            src/finagent/visualization/linked_analytics_acceptance.py \
            src/finagent/visualization/linked_analytics_acceptance_routes.py \
            scripts/run_workspace.py \
            scripts/run_workbench_control.py \
            scripts/run_local_ashare_factor_research.py \
            scripts/run_local_ashare_robust_research.py \
            scripts/run_ashare_portfolio_validation.py \
            scripts/materialize_local_ashare_market_bars.py \
            scripts/export_workspace_review_bundle.py \
            tests/test_workspace_api_v1.py \
            tests/test_workspace_api_v2.py \
            tests/test_workspace_reserve_a54.py \
            tests/test_agent_index_v3.py \
            tests/test_workbench_deep_links_v33.py \
            tests/test_workbench_stream_v34.py \
            tests/test_workbench_foundation_v35.py \
            tests/test_strategy_explorer_v42.py \
            tests/test_strategy_explorer_optional_dependency_v42.py \
            tests/test_factor_tearsheet_v43.py \
            tests/test_factor_tearsheet_authority_v43.py \
            tests/test_portfolio_execution_v44.py \
            tests/test_linked_analytics_acceptance_v45.py \
            tests/test_historical_workbench_operations_ac1.py \
            tests/test_market_bar_series_ac2.py \
            --select E4,E7,E9,F
      - name: Type check
        run: mypy --follow-imports=silent src/finagent/domain/market_bars.py src/finagent/data/market_bar_series.py src/finagent/application/control_services.py src/finagent/visualization/agent_projection.py src/finagent/visualization/agent_index.py src/finagent/visualization/workspace_api.py src/finagent/visualization/workspace_v2.py src/finagent/visualization/reserve_projection.py src/finagent/visualization/workbench_api.py src/finagent/visualization/workbench_control_api.py src/finagent/visualization/historical_command_catalog.py src/finagent/visualization/historical_workbench_control_api.py src/finagent/visualization/workbench_links.py src/finagent/visualization/workbench_streams.py src/finagent/visualization/strategy_explorer.py src/finagent/visualization/factor_tearsheet.py src/finagent/visualization/factor_tearsheet_routes.py src/finagent/visualization/portfolio_execution.py src/finagent/visualization/portfolio_execution_routes.py src/finagent/visualization/linked_analytics_acceptance.py src/finagent/visualization/linked_analytics_acceptance_routes.py
      - name: Dependency consistency
        run: python -m pip check
