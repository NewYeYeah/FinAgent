name: a5-reserve-eligibility

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/ashare_reserve.py"
      - "src/finagent/research/__init__.py"
      - "scripts/attest_v2_reserve_review.py"
      - "scripts/seal_ashare_reserve_eligibility.py"
      - "tests/test_ashare_reserve_eligibility_a5.py"
      - "docs/guides/ashare-reserve.md"
      - "pyproject.toml"
      - ".github/workflows/a5-reserve.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/research/ashare_reserve.py"
      - "src/finagent/research/__init__.py"
      - "scripts/attest_v2_reserve_review.py"
      - "scripts/seal_ashare_reserve_eligibility.py"
      - "tests/test_ashare_reserve_eligibility_a5.py"
      - "docs/guides/ashare-reserve.md"
      - "pyproject.toml"
      - ".github/workflows/a5-reserve.yml"

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workspace]"
      - name: A5-1 contract tests
        env:
          PYTHONUTF8: "1"
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/test_ashare_reserve_eligibility_a5.py
      - name: Compile A5-1 entry points
        run: python -m py_compile src/finagent/research/ashare_reserve.py scripts/attest_v2_reserve_review.py scripts/seal_ashare_reserve_eligibility.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workspace]"
      - name: Lint
        run: |
          ruff check \
            src/finagent/research/ashare_reserve.py \
            scripts/attest_v2_reserve_review.py \
            scripts/seal_ashare_reserve_eligibility.py \
            tests/test_ashare_reserve_eligibility_a5.py \
            --select E4,E7,E9,F
      - name: Type check
        run: mypy src/finagent/research/ashare_reserve.py
      - name: Dependency consistency
        run: python -m pip check
