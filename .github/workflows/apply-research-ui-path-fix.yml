name: apply-research-ui-path-fix

on:
  push:
    branches:
      - research-visualization-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-visualization-v1
          fetch-depth: 0
      - name: Add unique callable page URL paths
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/research_ui.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '                icon="📊",\n                default=True,':
                  '                icon="📊",\n                url_path="overview",\n                default=True,',
              '                title="Factor Lab",\n                icon="🧪",\n            ),':
                  '                title="Factor Lab",\n                icon="🧪",\n                url_path="factor-lab",\n            ),',
              '            st.Page(lambda: _ensemble_page(report), title="Ensemble", icon="🧩"),':
                  '            st.Page(\n                lambda: _ensemble_page(report),\n                title="Ensemble",\n                icon="🧩",\n                url_path="ensemble",\n            ),',
              '            st.Page(lambda: _universe_page(report), title="Universe", icon="🗂️"),':
                  '            st.Page(\n                lambda: _universe_page(report),\n                title="Universe",\n                icon="🗂️",\n                url_path="universe",\n            ),',
              '                title="Agent Discovery",\n                icon="🤖",\n            ),':
                  '                title="Agent Discovery",\n                icon="🤖",\n                url_path="agent-discovery",\n            ),',
              '            st.Page(lambda: _lineage_page(report), title="Lineage", icon="🔒"),':
                  '            st.Page(\n                lambda: _lineage_page(report),\n                title="Lineage",\n                icon="🔒",\n                url_path="lineage",\n            ),',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'expected one page snippet, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile apps/research_ui.py
      - name: Commit application fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-research-ui-path-fix.yml
          git add apps/research_ui.py
          git commit -m "ui: assign unique Streamlit page URL paths"
          git push origin HEAD:research-visualization-v1
