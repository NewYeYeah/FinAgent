name: r4-campaign-freeze

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/agents/**"
      - "src/finagent/application/**"
      - "src/finagent/research/**"
      - "tests/*r4*"
      - "scripts/r4_campaign.py"
      - "configs/research/r4*"
      - "configs/llm.toml"
      - ".github/workflows/r4-campaign-freeze.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - run: uv sync --frozen --extra dev --extra workspace --extra adaptive-research
      - name: Offline provider admission, freeze, guarded execution, drift and campaign fixtures
        run: uv run --frozen pytest tests/test_r4_provider_admission.py tests/test_r4_campaign_freeze.py tests/test_r4_campaign_operator.py
      - name: Existing static/adaptive admission and runtime regression
        run: uv run --frozen pytest tests/test_r4_controller.py tests/test_r4_controller_boundaries.py tests/test_us_r3_agent_runtime.py tests/test_us_r3_provider.py tests/test_adaptive_walkforward.py
      - name: Focused typing
        run: >-
          uv run --frozen mypy --strict --follow-imports=silent
          src/finagent/agents/r4_campaign_capabilities.py
          src/finagent/agents/r4_provider_admission.py
          src/finagent/application/r4_campaign.py
          src/finagent/application/r4_campaign_admission.py
          src/finagent/research/r4_campaign_protocol.py
      - name: Focused lint
        run: >-
          uv run --frozen ruff check
          src/finagent/agents/r3_provider.py src/finagent/agents/r3_runtime.py src/finagent/agents/r3_ledger.py
          src/finagent/agents/r4_campaign_capabilities.py src/finagent/agents/r4_provider_admission.py
          src/finagent/application/r4_campaign.py src/finagent/application/r4_campaign_admission.py
          src/finagent/research/r4_campaign_protocol.py scripts/r4_campaign.py
          tests/test_r4_provider_admission.py tests/test_r4_campaign_freeze.py tests/test_r4_campaign_operator.py
      - run: uv run --frozen python scripts/check_docs.py
