name: us-a1-factorgraph-materializer

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/us_a1_factor_materialization.py"
      - "tests/test_us_a1_factor_materialization.py"
      - "docs/guides/us-a1-factorgraph-materialization.md"
      - ".github/workflows/us-a1-factorgraph-materializer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materializer:
    name: US-A1 FactorGraph numeric parity and reuse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: All-62 A0 bitwise parity
        run: |
          uv run --frozen pytest -q \
            tests/test_us_a1_factor_materialization.py::test_all_62_legacy_candidates_are_bitwise_equal_to_a0_per_formation
      - name: Shared-DAG reuse and order independence
        run: |
          uv run --frozen pytest -q \
            tests/test_us_a1_factor_materialization.py::test_batch_compiler_reuses_canonical_subexpressions_and_is_order_independent
      - name: Materializer fail-closed bounds
        run: |
          uv run --frozen pytest -q \
            tests/test_us_a1_factor_materialization.py::test_materializer_rejects_cross_sectional_or_regime_operators_until_explicit_extension \
            tests/test_us_a1_factor_materialization.py::test_materialization_batch_size_is_bounded \
            tests/test_us_a1_factor_materialization.py::test_materializer_rejects_non_increasing_bar_order
      - name: A1-0 and A0 predecessor regression
        run: |
          uv run --frozen pytest -q \
            tests/test_us_a1_factor_graph.py \
            tests/test_us_a0_protocol.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/research/us_a1_factor_materialization.py \
            tests/test_us_a1_factor_materialization.py
          uv run --frozen mypy --strict \
            src/finagent/research/us_a1_factor_materialization.py
          uv run --frozen python -m py_compile \
            src/finagent/research/us_a1_factor_materialization.py
