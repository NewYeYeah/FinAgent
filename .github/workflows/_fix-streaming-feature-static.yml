name: fix-streaming-feature-static

on:
  push:
    branches: [rt-streaming-feature-strategy-v1]
    paths:
      - "scripts/_fix_streaming_feature_static.py"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt-streaming-feature-strategy-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply static fixes
        run: python scripts/_fix_streaming_feature_static.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/finagent/realtime/streaming_resample.py tests/test_streaming_feature_strategy_v1.py
          git diff --cached --exit-code && exit 0
          git commit -m "Fix streaming feature static issues"
          git push origin HEAD:rt-streaming-feature-strategy-v1
