name: us-r2-regime-projection

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/us_r2_regime_projection.py"
      - "scripts/materialize_us_r2_regime_projection.py"
      - "tests/test_us_r2_regime_projection.py"
      - "docs/guides/us-r2-regime-projection.md"
      - ".github/workflows/us-r2-regime-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regime-projection:
    name: US-R2 reusable regime/session projection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Regime projection regression
        run: uv run --frozen pytest -q tests/test_us_r2_regime_projection.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/research/us_r2_regime_projection.py \
            scripts/materialize_us_r2_regime_projection.py \
            tests/test_us_r2_regime_projection.py
          uv run --frozen mypy --strict \
            src/finagent/research/us_r2_regime_projection.py \
            scripts/materialize_us_r2_regime_projection.py
          uv run --frozen python -m py_compile \
            src/finagent/research/us_r2_regime_projection.py \
            scripts/materialize_us_r2_regime_projection.py
