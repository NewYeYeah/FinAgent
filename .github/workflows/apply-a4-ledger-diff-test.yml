name: apply-a4-ledger-diff-test

on:
  push:
    branches:
      - a4-execution-aware-portfolio-validation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a4-execution-aware-portfolio-validation
          fetch-depth: 0
      - name: Apply test diagnostics
        run: |
          python tools/apply_a4_ledger_diff_test.py
          python -m py_compile tests/test_ashare_portfolio_validation_a4.py
      - name: Commit test changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test: expose exact A4 ledger divergence"
          git push origin HEAD:a4-execution-aware-portfolio-validation
