name: temporary-patch-streaming-label-clock

on:
  push:
    branches: [rt-replay-experiment-campaign-v1]
    paths:
      - "scripts/_patch_streaming_label_price_clock.py"
      - ".github/workflows/_temporary_patch_streaming_label_clock.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt-replay-experiment-campaign-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/_patch_streaming_label_price_clock.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/finagent/research/streaming_experiment_bridge.py
          git diff --cached --quiet && exit 0
          git commit -m "Preserve batch label price-source clock in streaming evidence"
          git push origin HEAD:rt-replay-experiment-campaign-v1
