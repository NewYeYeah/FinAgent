name: workbench2-apply-wording-fix
on:
  push:
    branches: [codex/workbench2-experiments-graph]
    paths: [scripts/_workbench2_wording_fix.py, .github/workflows/workbench2-wording-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/workbench2-experiments-graph
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/_workbench2_wording_fix.py
      - run: rm scripts/_workbench2_wording_fix.py .github/workflows/workbench2-wording-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(workbench): align reasoning-boundary wording"
          git push origin HEAD:codex/workbench2-experiments-graph
