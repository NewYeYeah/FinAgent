name: v31-apply

on:
  push:
    branches:
      - feature/v3-agent-index

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'stage V3-1 apply workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3-agent-index
          fetch-depth: 0

      - name: Materialize verified V3-1 product patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          expected = [
              ('part00.txt', '038197779c4bdc2978373cd83c9c69ae08ce5a3e1cc03cad3acd3c17b9e88abf'),
              ('part01.txt', 'a2ea07b563b1bbbbf95c32889c9c362c1e23ecaa9eb79700c62d2e95b49c42b2'),
          ]
          values = []
          for name, expected_digest in expected:
              raw = (Path('tools/v31_payload') / name).read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if digest != expected_digest:
                  raise SystemExit(f'{name} digest mismatch: {digest}')
              values.append(raw.decode('utf-8').strip())
          patch = gzip.decompress(base64.b64decode(''.join(values)))
          digest = hashlib.sha256(patch).hexdigest()
          expected_patch = 'd93b5ca3907e2c0655569c32d9612d8eb9347fd6cb3ff4bcdbb57a3083430c32'
          if digest != expected_patch:
              raise SystemExit(f'V3-1 patch digest mismatch: {digest}')
          Path('/tmp/v31.patch').write_bytes(patch)
          print(f'patch_bytes={len(patch)} sha256={digest}')
          PY

      - name: Apply V3-1 product delivery
        run: |
          git apply --check /tmp/v31.patch
          git apply /tmp/v31.patch
          git rm -rf tools/v31_payload
          git diff --check

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "visualization: implement V3-1 Agent Index contract"
          git push origin HEAD:feature/v3-agent-index
