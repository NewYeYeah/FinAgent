name: temporary-patch-replay-campaign-hardening

on:
  push:
    branches: [rt-replay-experiment-campaign-v1]
    paths:
      - "scripts/_patch_replay_campaign_hardening.py"
      - ".github/workflows/_temporary_patch_replay_campaign_hardening.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt-replay-experiment-campaign-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/_patch_replay_campaign_hardening.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/finagent/research/replay_experiment_campaign.py tests/test_replay_experiment_campaign_v1.py .github/workflows/replay-experiment-campaign-v1.yml
          git diff --cached --quiet && exit 0
          git commit -m "Harden replay experiment campaign report and CI"
          git push origin HEAD:rt-replay-experiment-campaign-v1
