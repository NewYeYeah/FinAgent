name: v2-fix-python

on:
  push:
    branches:
      - feature/visualization-v2-complete

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visualization-v2-complete
          fetch-depth: 0
      - name: Fix Windows SQLite lifecycle and mypy types
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/finagent/visualization/workspace_v2.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('from typing import Any\n', 'from typing import Any, cast\n'),
              ('        result = float(value)\n', '        result = float(cast(Any, value))\n'),
              ('        return int(value)\n', '        return int(cast(Any, value))\n'),
              ('                row = {\n', '                row: dict[str, object] = {\n'),
              ('        fee_totals: Counter[str] = Counter()\n', '        fee_totals: dict[str, float] = {}\n'),
              ('                        fee_totals[key] += _number(fees.get(key))\n', '                        fee_totals[key] = fee_totals.get(key, 0.0) + _number(fees.get(key))\n'),
              ('                    fee_totals["slippage"] += _number(fill.get("slippage"))\n', '                    fee_totals["slippage"] = fee_totals.get("slippage", 0.0) + _number(fill.get("slippage"))\n'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing replacement anchor: {old!r}')
              s = s.replace(old, new, 1)
          old = '''        try:\n            with sqlite3.connect(temp) as connection:\n                connection.execute(\n'''
          new = '''        try:\n            connection = sqlite3.connect(temp)\n            try:\n                connection.execute(\n'''
          if old not in s:
              raise SystemExit('missing sqlite open anchor')
          s = s.replace(old, new, 1)
          old = '''                connection.executemany(\n                    "INSERT INTO metadata VALUES (?, ?)", tuple(metadata.items())\n                )\n                connection.commit()\n            os.replace(temp, path)\n        finally:\n            temp.unlink(missing_ok=True)\n'''
          new = '''                connection.executemany(\n                    "INSERT INTO metadata VALUES (?, ?)", tuple(metadata.items())\n                )\n                connection.commit()\n            finally:\n                connection.close()\n            os.replace(temp, path)\n        finally:\n            temp.unlink(missing_ok=True)\n'''
          if old not in s:
              raise SystemExit('missing sqlite close anchor')
          s = s.replace(old, new, 1)
          old = '''        gate_rows = self.program_gates(source.root.program_id)["items"] if source else []\n        factor_summary: list[dict[str, object]] = []\n        for item in gate_rows:\n            factor_summary.append(\n                {\n                    "feature_id": item["feature_id"],\n                    "feature_digest": item["feature_digest"],\n                    "passed": item["passed"],\n                    "robust_score": item["robust_score"],\n                    "reason_codes": ";".join(str(value) for value in item["reason_codes"]),\n                }\n            )\n'''
          new = '''        gate_rows = (\n            _sequence(self.program_gates(source.root.program_id).get("items"))\n            if source\n            else ()\n        )\n        factor_summary: list[dict[str, object]] = []\n        for raw_item in gate_rows:\n            item = _mapping(raw_item)\n            factor_summary.append(\n                {\n                    "feature_id": item.get("feature_id", ""),\n                    "feature_digest": item.get("feature_digest", ""),\n                    "passed": item.get("passed", False),\n                    "robust_score": item.get("robust_score", 0.0),\n                    "reason_codes": ";".join(\n                        str(value) for value in _sequence(item.get("reason_codes"))\n                    ),\n                }\n            )\n'''
          if old not in s:
              raise SystemExit('missing review bundle anchor')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile src/finagent/visualization/workspace_v2.py
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/finagent/visualization/workspace_v2.py
          git commit -m "fix: make V2 catalog portable and type-safe"
          git push origin HEAD:feature/visualization-v2-complete
