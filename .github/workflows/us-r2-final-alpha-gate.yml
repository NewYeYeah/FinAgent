name: us-r2-final-alpha-gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/us_r2_final.py"
      - "scripts/assemble_us_r2_alpha_evidence.py"
      - "scripts/review_us_r2_alpha_gate.py"
      - "tests/test_us_r2_final.py"
      - "docs/guides/us-r2-final-alpha-gate.md"
      - "docs/status.toml"
      - "docs/development/changelog.md"
      - ".github/workflows/us-r2-final-alpha-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-alpha-gate:
    name: US-R2 reviewed terminal and authority boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Final Gate policy and terminal tests
        run: uv run --frozen pytest -q tests/test_us_r2_final.py
      - name: R2 evidence predecessor regression
        run: |
          uv run --frozen pytest -q \
            tests/test_us_r2_primary_statistics.py \
            tests/test_us_r2_pooled_inference.py \
            tests/test_us_r2_candidate_robustness.py \
            tests/test_us_r2_candidate_robustness_runtime.py
      - name: R1 Gate inheritance regression
        run: |
          uv run --frozen pytest -q \
            tests/test_us_r1_final_evidence.py \
            tests/test_us_r1_contract_validation.py \
            tests/test_us_r1_preregistration_gate.py
      - name: Documentation governance
        run: |
          uv run --frozen pytest -q tests/test_docs_governance.py
          uv run --frozen python scripts/check_docs.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/research/us_r2_final.py \
            scripts/assemble_us_r2_alpha_evidence.py \
            scripts/review_us_r2_alpha_gate.py \
            tests/test_us_r2_final.py
          uv run --frozen mypy --strict \
            src/finagent/research/us_r2_final.py \
            scripts/assemble_us_r2_alpha_evidence.py \
            scripts/review_us_r2_alpha_gate.py
          uv run --frozen python -m py_compile \
            src/finagent/research/us_r2_final.py \
            scripts/assemble_us_r2_alpha_evidence.py \
            scripts/review_us_r2_alpha_gate.py
