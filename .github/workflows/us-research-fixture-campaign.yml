name: us-research-fixture-campaign

on:
  pull_request:
    paths:
      - "src/finagent/research/us_fixture_campaign.py"
      - "scripts/run_us_research_fixture_campaign.py"
      - "tests/test_us_research_fixture_campaign.py"
      - "docs/guides/us-research-fixture-campaign.md"
      - ".github/workflows/us-research-fixture-campaign.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  us-research-fixture-campaign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Focused fixture regression
        run: uv run --frozen pytest -q tests/test_us_research_fixture_campaign.py
      - name: CLI deterministic smoke
        run: |
          uv run --frozen python scripts/run_us_research_fixture_campaign.py \
            --generated-at 2026-09-03T06:30:00+00:00 \
            --output /tmp/us_research_fixture_campaign.json
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/research/us_fixture_campaign.py \
            scripts/run_us_research_fixture_campaign.py \
            tests/test_us_research_fixture_campaign.py
          uv run --frozen mypy --strict \
            src/finagent/research/us_fixture_campaign.py \
            scripts/run_us_research_fixture_campaign.py
          uv run --frozen python -m py_compile \
            src/finagent/research/us_fixture_campaign.py \
            scripts/run_us_research_fixture_campaign.py
