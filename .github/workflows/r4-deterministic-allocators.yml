name: r4-deterministic-allocators

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/factor_performance.py"
      - "src/finagent/research/factor_allocators.py"
      - "src/finagent/research/ridge_meta_allocator.py"
      - "src/finagent/research/adaptive*.py"
      - "src/finagent/research/market_state*.py"
      - "src/finagent/research/factor_library*.py"
      - "src/finagent/research/us_a1_factor*.py"
      - "src/finagent/research/us_baseline*.py"
      - "src/finagent/research/us_r3_economics.py"
      - "src/finagent/research/us_r3_economic_campaign.py"
      - "src/finagent/research/us_r3_usability.py"
      - "src/finagent/domain/research.py"
      - "src/finagent/domain/trading.py"
      - "src/finagent/domain/trading_calendar.py"
      - "src/finagent/application/adaptive_portfolio.py"
      - "scripts/run_r4_walkforward.py"
      - "tests/test_factor_allocators.py"
      - "tests/test_adaptive_walkforward.py"
      - "tests/adaptive_allocator_fixture.py"
      - "tests/test_us_r3_economic_campaign.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/r4-deterministic-allocators.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-walkforward:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - run: uv sync --frozen --extra dev --extra adaptive-research
      - name: Causal history, five allocators, three-fold Parquet integration and CLI
        run: uv run --frozen pytest -q tests/test_factor_allocators.py tests/test_adaptive_walkforward.py
      - name: MarketState, FactorLibrary, FactorGraph, R3 economics and R2 predecessor regression
        run: >-
          uv run --frozen pytest -q
          tests/test_market_state.py tests/test_factor_library.py tests/test_r4_research_slice.py
          tests/test_us_a1_factor_graph.py tests/test_us_a1_factor_materialization.py
          tests/test_us_a1_factor_panel_materialization.py tests/test_us_r3_economics.py
          tests/test_us_r2_regime_projection.py tests/test_us_r2_regime_projection_v2.py
      - name: Lint
        run: >-
          uv run --frozen ruff check
          src/finagent/research/factor_performance.py src/finagent/research/factor_allocators.py
          src/finagent/research/ridge_meta_allocator.py src/finagent/research/adaptive_portfolio_evaluation.py
          src/finagent/research/adaptive_walkforward.py src/finagent/research/factor_library.py
          src/finagent/application/adaptive_portfolio.py scripts/run_r4_walkforward.py
          tests/test_factor_allocators.py tests/test_adaptive_walkforward.py tests/adaptive_allocator_fixture.py
      - name: Strict focused typing
        run: >-
          uv run --frozen mypy --strict --follow-imports=skip
          src/finagent/research/factor_performance.py src/finagent/research/factor_allocators.py
          src/finagent/research/ridge_meta_allocator.py src/finagent/research/adaptive_portfolio_evaluation.py
          src/finagent/research/adaptive_walkforward.py src/finagent/research/factor_library.py
          src/finagent/application/adaptive_portfolio.py scripts/run_r4_walkforward.py
      - run: uv run --frozen python scripts/check_docs.py
