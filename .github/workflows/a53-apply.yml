name: a53-apply

on:
  push:
    branches:
      - feature/a5-consumed-state

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'stage A5-3 apply workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/a5-consumed-state
          fetch-depth: 0

      - name: Materialize verified A5-3 product patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          expected_parts = [
              ('part00.txt', '25c1a4097b910d3bfdc7253f990e3d47db80e826df56970ebe83b84823f4bfd6'),
              ('part01_0.txt', '5acf57bd71b69591f934a663fffb6e13e0246b9d6d1d2ea19cd6045d43c22787'),
              ('part01_1.txt', '02d70abccacf0096f88baf036ced29e233f1972cb16cd3608cf0ae1e3187169c'),
              ('part01_2.txt', 'f93a782f2753bc78d6332369bc0f4953d8a224d08e21d90fec484286dd4d0ca4'),
              ('part01_3.txt', 'dbcffd2c83eeb75fe5221d6358b988139432ce8c448fcbd0c4cf549e27ee716e'),
              ('part02.txt', 'c410978efaf31fe8aeeddf123d907772f397e9c31e96f24a93e115903dd12a83'),
          ]
          parts = []
          for name, expected in expected_parts:
              path = Path('tools/a53_payload') / name
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              print(name, len(data), digest)
              if digest != expected:
                  raise SystemExit(f'{name} digest mismatch: {digest}')
              parts.append(data.decode('utf-8').strip())
          patch = gzip.decompress(base64.b64decode(''.join(parts)))
          digest = hashlib.sha256(patch).hexdigest()
          expected = 'ac90b55308a7b90d54cf763b9c85575c1c91188e6946a7aab5619eef7e2b463a'
          if digest != expected:
              raise SystemExit(f'A5-3 patch digest mismatch: {digest}')
          Path('/tmp/a53.patch').write_bytes(patch)
          print(f'patch_bytes={len(patch)} sha256={digest}')
          PY

      - name: Apply A5-3 product delivery
        run: |
          git apply --check /tmp/a53.patch
          git apply /tmp/a53.patch
          git rm -rf tools/a53_payload
          git diff --check

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "governance: implement A5-3 durable consumed state"
          git push origin HEAD:feature/a5-consumed-state
