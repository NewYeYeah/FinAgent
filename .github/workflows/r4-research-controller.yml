name: r4-research-controller

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/agents/**"
      - "src/finagent/application/**"
      - "src/finagent/research/**"
      - "src/finagent/visualization/**"
      - "workspace/**"
      - "tests/*r4*"
      - "tests/adaptive_allocator_fixture.py"
      - "scripts/r4_console_fixture.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/r4-research-controller.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - run: uv sync --frozen --extra dev --extra workspace --extra adaptive-research
      - name: Real offline loops, adversarial admission, audit and Control Plane
        run: uv run --frozen pytest -q tests/test_r4_controller.py tests/test_r4_controller_boundaries.py tests/test_r4_research_control.py
      - name: Existing runtime, static walk-forward and audit regression
        run: >-
          uv run --frozen pytest -q tests/test_us_r3_agent_runtime.py
          tests/test_factor_allocators.py tests/test_adaptive_walkforward.py
          tests/test_agent_policy_audit_phase3a.py tests/test_workbench_stream_v34.py
          tests/test_workbench_control_api_v32c.py tests/test_workbench_deep_links_v33.py
      - name: Focused typing
        run: >-
          uv run --frozen mypy --strict --follow-imports=skip
          src/finagent/agents/r3_contracts.py src/finagent/agents/r3_ledger.py src/finagent/agents/r3_runtime.py
          src/finagent/agents/r4_contracts.py src/finagent/agents/r4_controller.py src/finagent/agents/research_audit.py
          src/finagent/application/research_controller.py src/finagent/application/research_controller_host.py
          src/finagent/research/adaptive_factor_admission.py src/finagent/research/r4_feedback.py
          src/finagent/visualization/research_ag_ui.py
      - name: Focused lint
        run: >-
          uv run --frozen ruff check
          src/finagent/agents/r3_ledger.py src/finagent/agents/r3_runtime.py
          src/finagent/agents/r4_contracts.py src/finagent/agents/r4_controller.py src/finagent/agents/research_audit.py
          src/finagent/application/research_controller.py src/finagent/application/research_controller_host.py
          src/finagent/research/adaptive_factor_admission.py src/finagent/research/r4_feedback.py
          src/finagent/visualization/research_ag_ui.py tests/r4_controller_fixture.py
          tests/test_r4_controller.py tests/test_r4_controller_boundaries.py tests/test_r4_research_control.py
          scripts/r4_console_fixture.py
      - run: uv run --frozen python scripts/check_docs.py
  console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - run: uv sync --frozen --extra dev --extra workspace --extra adaptive-research
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workspace/package-lock.json
      - run: npm ci
        working-directory: workspace
      - run: npm test
        working-directory: workspace
      - run: npm run build
        working-directory: workspace
      - run: npx playwright install --with-deps chromium
        working-directory: workspace
      - name: Real scripted Controller browser acceptance
        run: npx playwright test --config playwright.research.config.ts
        working-directory: workspace
