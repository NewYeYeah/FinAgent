name: a53-lint-fix

on:
  push:
    branches:
      - feature/a5-consumed-state

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'stage A5-3 lint fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/a5-consumed-state
          fetch-depth: 0
      - name: Remove stale lifecycle import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/finagent/research/ashare_reserve_lifecycle.py')
          text = path.read_text(encoding='utf-8')
          old = 'from types import MappingProxyType\n'
          if old not in text:
              raise SystemExit('expected MappingProxyType import not found')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/finagent/research/ashare_reserve_lifecycle.py
          git commit -m "fix: remove unused A5-3 lifecycle import"
          git push origin HEAD:feature/a5-consumed-state
