name: v4-factor-series

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/factor_series.py"
      - "src/finagent/research/__init__.py"
      - "scripts/materialize_factor_series.py"
      - "tests/test_factor_series_v41.py"
      - ".github/workflows/v4-factor-series.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/research/factor_series.py"
      - "src/finagent/research/__init__.py"
      - "scripts/materialize_factor_series.py"
      - "tests/test_factor_series_v41.py"
      - ".github/workflows/v4-factor-series.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,local-parquet]"
      - name: Lint V4-1 owned surface
        run: |
          ruff check \
            src/finagent/research/factor_series.py \
            scripts/materialize_factor_series.py \
            tests/test_factor_series_v41.py \
            --select E4,E7,E9,F
      - name: Type check V4-1 owned surface
        run: |
          mypy \
            src/finagent/research/factor_series.py \
            scripts/materialize_factor_series.py
      - name: Public import contract
        run: |
          python - <<'PY'
          from finagent.research import (
              AshareFactorSeriesMaterializer,
              FactorSeriesManifest,
              FactorSeriesProjection,
              FactorSeriesRow,
              write_factor_series,
          )
          assert AshareFactorSeriesMaterializer
          assert FactorSeriesManifest
          assert FactorSeriesProjection
          assert FactorSeriesRow
          assert write_factor_series
          PY
      - name: Dependency consistency
        run: python -m pip check

  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,local-parquet]"
      - name: V4-1 acceptance
        env:
          PYTHONUTF8: "1"
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/test_factor_series_v41.py
