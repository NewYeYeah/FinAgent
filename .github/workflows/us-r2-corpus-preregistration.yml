name: us-r2-corpus-preregistration

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/us_r2_*.py"
      - "scripts/inventory_us_r2_corpus.py"
      - "tests/test_us_r2_corpus.py"
      - "docs/guides/us-r2-multi-regime-research.md"
      - ".github/workflows/us-r2-corpus-preregistration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  us-r2-corpus-preregistration:
    name: US-R2 corpus and preregistration contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Focused regression
        run: |
          uv run --frozen pytest -q \
            tests/test_us_r2_corpus.py \
            tests/test_us_b0_turnover_determinism.py \
            tests/test_us_r1_preregistration_gate.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/research/us_r2_corpus.py \
            src/finagent/research/us_r2_protocol.py \
            scripts/inventory_us_r2_corpus.py \
            tests/test_us_r2_corpus.py
          uv run --frozen mypy --strict \
            src/finagent/research/us_r2_corpus.py \
            src/finagent/research/us_r2_protocol.py \
            scripts/inventory_us_r2_corpus.py
          uv run --frozen python -m py_compile \
            src/finagent/research/us_r2_corpus.py \
            src/finagent/research/us_r2_protocol.py \
            scripts/inventory_us_r2_corpus.py
