name: us-r2-candidate-cache

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/us_r2_candidate_cache.py"
      - "src/finagent/research/us_r2_candidate_runtime.py"
      - "scripts/materialize_us_r2_candidate_cache.py"
      - "tests/test_us_r2_candidate_cache.py"
      - "docs/guides/us-r2-candidate-cache.md"
      - ".github/workflows/us-r2-candidate-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-cache:
    name: US-R2 frozen shared-DAG candidate cache
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Frozen denominator, parity, deterministic-cache regression
        run: uv run --frozen pytest -q tests/test_us_r2_candidate_cache.py
      - name: Shared-DAG predecessor bitwise parity
        run: uv run --frozen pytest -q tests/test_us_a1_factor_materialization.py
      - name: R2 base-panel and freeze predecessor regression
        run: |
          uv run --frozen pytest -q \
            tests/test_us_r2_base_panel.py \
            tests/test_us_r2_base_panel_batch.py \
            tests/test_us_r2_frozen_protocol.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/research/us_r2_candidate_cache.py \
            src/finagent/research/us_r2_candidate_runtime.py \
            scripts/materialize_us_r2_candidate_cache.py \
            tests/test_us_r2_candidate_cache.py
          uv run --frozen mypy --strict \
            src/finagent/research/us_r2_candidate_cache.py \
            src/finagent/research/us_r2_candidate_runtime.py \
            scripts/materialize_us_r2_candidate_cache.py
          uv run --frozen python -m py_compile \
            src/finagent/research/us_r2_candidate_cache.py \
            src/finagent/research/us_r2_candidate_runtime.py \
            scripts/materialize_us_r2_candidate_cache.py
