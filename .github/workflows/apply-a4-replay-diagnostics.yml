name: apply-a4-replay-diagnostics

on:
  push:
    branches:
      - a4-execution-aware-portfolio-validation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a4-execution-aware-portfolio-validation
          fetch-depth: 0
      - name: Apply diagnostics
        run: |
          python tools/apply_a4_replay_diagnostics.py
          python -m py_compile scripts/run_ashare_portfolio_validation.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts
          git commit -m "backtest: expose exact A4 replay divergence"
          git push origin HEAD:a4-execution-aware-portfolio-validation
