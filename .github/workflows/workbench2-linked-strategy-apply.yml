name: workbench2-linked-strategy-apply

on:
  push:
    branches: [codex/workbench2-linked-strategy-analytics]
    paths:
      - "scripts/_workbench2_linked_strategy_patch.py"
      - "scripts/_workbench2_linked_strategy_patch_fix.py"
      - ".github/workflows/workbench2-linked-strategy-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/workbench2-linked-strategy-analytics
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize patch anchor
        run: python scripts/_workbench2_linked_strategy_patch_fix.py
      - name: Apply linked strategy patch
        run: python scripts/_workbench2_linked_strategy_patch.py
      - name: Commit implementation and self-clean
        run: |
          git rm scripts/_workbench2_linked_strategy_patch.py scripts/_workbench2_linked_strategy_patch_fix.py .github/workflows/workbench2-linked-strategy-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(workbench): link strategy analytics by canonical evidence"
          git push origin HEAD:codex/workbench2-linked-strategy-analytics
