name: apply-a2p5-finish

on:
  push:
    branches:
      - a2p5-research-correctness-stability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2p5-research-correctness-stability
          fetch-depth: 0
      - name: Apply finish transformations
        run: |
          python tools/apply_a2p5_finish.py
          python -m py_compile \
            src/finagent/research/__init__.py \
            scripts/run_local_ashare_factor_research.py \
            tests/test_ashare_factor_acceptance_a2.py
      - name: Commit finished sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/apply_a2p5_finish.py .github/workflows/apply-a2p5-finish.yml
          git add src scripts configs tests docs
          git commit -m "research: expose and test A2.5 P0 controls"
          git push origin HEAD:a2p5-research-correctness-stability
