name: apply-realtime-source-strategy-docs

on:
  push:
    branches: [realtime-source-strategy-docs]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtime-source-strategy-docs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source-strategy documentation patch
        run: python scripts/_apply_realtime_source_strategy_docs.py
      - name: Documentation governance
        run: python scripts/check_docs.py
      - name: Commit generated documentation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/current-plan.md docs/guides/realtime-source-development-model.md skills/finagent-project/SKILL.md
          git diff --cached --exit-code && exit 0
          git commit -m "Document realtime source development model"
          git push origin HEAD:realtime-source-strategy-docs
