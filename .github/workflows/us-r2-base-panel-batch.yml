name: us-r2-base-panel-batch

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/us_r2_base_panel_batch.py"
      - "scripts/materialize_us_r2_base_panel_all_years.py"
      - "tests/test_us_r2_base_panel_batch.py"
      - "docs/guides/us-r2-base-panel-batch.md"
      - ".github/workflows/us-r2-base-panel-batch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-orchestration:
    name: US-R2 resumable annual base-panel batch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Resumability and fail-closed regression
        run: uv run --frozen pytest -q tests/test_us_r2_base_panel_batch.py
      - name: Predecessor shared-panel regression
        run: uv run --frozen pytest -q tests/test_us_r2_base_panel.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/research/us_r2_base_panel_batch.py \
            scripts/materialize_us_r2_base_panel_all_years.py \
            tests/test_us_r2_base_panel_batch.py
          uv run --frozen mypy --strict \
            src/finagent/research/us_r2_base_panel_batch.py \
            scripts/materialize_us_r2_base_panel_all_years.py
          uv run --frozen python -m py_compile \
            src/finagent/research/us_r2_base_panel_batch.py \
            scripts/materialize_us_r2_base_panel_all_years.py
