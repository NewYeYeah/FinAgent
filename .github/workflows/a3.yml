name: a3-ashare-execution

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/domain/ashare_execution.py"
      - "src/finagent/data/ashare_execution.py"
      - "src/finagent/services/ashare_execution.py"
      - "scripts/run_ashare_execution_smoke.py"
      - "tests/test_ashare_execution_a3.py"
      - "configs/execution/ashare_execution_smoke.example.toml"
      - ".github/workflows/a3.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/domain/ashare_execution.py"
      - "src/finagent/data/ashare_execution.py"
      - "src/finagent/services/ashare_execution.py"
      - "scripts/run_ashare_execution_smoke.py"
      - "tests/test_ashare_execution_a3.py"
      - "configs/execution/ashare_execution_smoke.example.toml"
      - ".github/workflows/a3.yml"

jobs:
  a3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: A3 tests
        env:
          PYTHONUTF8: "1"
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/test_ashare_execution_a3.py
      - name: Compile A3 entry points
        run: |
          python -m py_compile src/finagent/domain/ashare_execution.py src/finagent/data/ashare_execution.py src/finagent/services/ashare_execution.py scripts/run_ashare_execution_smoke.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint production surface
        run: |
          ruff check \
            src/finagent/domain/ashare_execution.py \
            src/finagent/data/ashare_execution.py \
            src/finagent/services/ashare_execution.py \
            scripts/run_ashare_execution_smoke.py \
            --select E4,E7,E9,F
      - name: Type check
        run: |
          mypy \
            src/finagent/domain/ashare_execution.py \
            src/finagent/data/ashare_execution.py \
            src/finagent/services/ashare_execution.py
