name: us-r2-robustness-base

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/us_r2_robustness_base.py"
      - "src/finagent/research/us_r2_robustness_batch.py"
      - "scripts/materialize_us_r2_robustness_base_year.py"
      - "scripts/materialize_us_r2_robustness_base_all_years.py"
      - "tests/test_us_r2_robustness_base.py"
      - "docs/guides/us-r2-robustness-base.md"
      - ".github/workflows/us-r2-robustness-base.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robustness-base:
    name: US-R2 exact frequency/decay robustness base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Exact four-slice R1 parity and resumability regression
        run: uv run --frozen pytest -q tests/test_us_r2_robustness_base.py
      - name: Shared 15m/60m predecessor regression
        run: uv run --frozen pytest -q tests/test_us_r2_base_panel.py
      - name: Pooled-inference predecessor regression
        run: uv run --frozen pytest -q tests/test_us_r2_pooled_inference.py
      - name: Primary-statistics predecessor regression
        run: uv run --frozen pytest -q tests/test_us_r2_primary_statistics.py
      - name: Frozen protocol predecessor regression
        run: uv run --frozen pytest -q tests/test_us_r2_frozen_protocol.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/research/us_r2_robustness_base.py \
            src/finagent/research/us_r2_robustness_batch.py \
            scripts/materialize_us_r2_robustness_base_year.py \
            scripts/materialize_us_r2_robustness_base_all_years.py \
            tests/test_us_r2_robustness_base.py
          uv run --frozen mypy --strict \
            src/finagent/research/us_r2_robustness_base.py \
            src/finagent/research/us_r2_robustness_batch.py \
            scripts/materialize_us_r2_robustness_base_year.py \
            scripts/materialize_us_r2_robustness_base_all_years.py
          uv run --frozen python -m py_compile \
            src/finagent/research/us_r2_robustness_base.py \
            src/finagent/research/us_r2_robustness_batch.py \
            scripts/materialize_us_r2_robustness_base_year.py \
            scripts/materialize_us_r2_robustness_base_all_years.py
