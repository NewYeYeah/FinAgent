name: v2-fix-hooks

on:
  push:
    branches:
      - feature/visualization-v2-complete

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visualization-v2-complete
          fetch-depth: 0
      - name: Fix ProjectCockpit hook order
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('workspace/src/v2.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''export function ProjectCockpitPage() {\n  const navigate = useNavigate();\n  const { data, error, loading } = useAsync(workspaceApi.projectsV2, []);\n  if (loading) return <LoadingState label="Loading governed projects" />;\n  if (error) return <ErrorState error={error} />;\n  const projects = data?.items ?? [];\n  const columns = useMemo<ColumnDef<WorkspaceProject, unknown>[]>(\n'''
          new = '''export function ProjectCockpitPage() {\n  const navigate = useNavigate();\n  const { data, error, loading } = useAsync(workspaceApi.projectsV2, []);\n  const columns = useMemo<ColumnDef<WorkspaceProject, unknown>[]>(\n'''
          if old not in text:
              raise SystemExit('first hook-order anchor missing')
          text = text.replace(old, new, 1)
          old2 = '''    [],\n  );\n  return (\n'''
          new2 = '''    [],\n  );\n  if (loading) return <LoadingState label="Loading governed projects" />;\n  if (error) return <ErrorState error={error} />;\n  const projects = data?.items ?? [];\n  return (\n'''
          if old2 not in text:
              raise SystemExit('second hook-order anchor missing')
          path.write_text(text.replace(old2, new2, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/src/v2.tsx
          git commit -m "fix: preserve ProjectCockpit hook order"
          git push origin HEAD:feature/visualization-v2-complete
