name: hw1-historical-workbench-release-smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/runtime/historical_workbench_release_smoke.py"
      - "src/finagent/runtime/historical_workbench_release_smoke_acceptance.py"
      - "configs/acceptance/historical_workbench_release_smoke.example.toml"
      - "scripts/run_historical_workbench_release_smoke.py"
      - "tests/test_historical_workbench_release_smoke.py"
      - "workspace/playwright.release-smoke.config.ts"
      - "workspace/e2e/historical-release-smoke.spec.ts"
      - "workspace/e2e/historical-release-smoke-real.spec.ts"
      - "docs/development/changelog-hw1-release-smoke.md"
      - "docs/testing/historical-workbench-release-smoke.md"
      - ".github/workflows/hw1-release-smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/runtime/historical_workbench_release_smoke.py"
      - "src/finagent/runtime/historical_workbench_release_smoke_acceptance.py"
      - "configs/acceptance/historical_workbench_release_smoke.example.toml"
      - "scripts/run_historical_workbench_release_smoke.py"
      - "tests/test_historical_workbench_release_smoke.py"
      - "workspace/playwright.release-smoke.config.ts"
      - "workspace/e2e/historical-release-smoke.spec.ts"
      - "workspace/e2e/historical-release-smoke-real.spec.ts"
      - "docs/development/changelog-hw1-release-smoke.md"
      - "docs/testing/historical-workbench-release-smoke.md"
      - ".github/workflows/hw1-release-smoke.yml"

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workspace,local-parquet]"
      - name: Contract tests
        env:
          PYTHONUTF8: "1"
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/test_historical_workbench_release_smoke.py
      - name: Compile
        run: |
          python -m py_compile \
            src/finagent/runtime/historical_workbench_release_smoke.py \
            src/finagent/runtime/historical_workbench_release_smoke_acceptance.py \
            scripts/run_historical_workbench_release_smoke.py
      - name: Ruff
        run: |
          ruff check \
            src/finagent/runtime/historical_workbench_release_smoke.py \
            src/finagent/runtime/historical_workbench_release_smoke_acceptance.py \
            scripts/run_historical_workbench_release_smoke.py \
            tests/test_historical_workbench_release_smoke.py \
            --select E4,E7,E9,F
      - name: Mypy
        run: |
          mypy --follow-imports=silent \
            src/finagent/runtime/historical_workbench_release_smoke.py \
            src/finagent/runtime/historical_workbench_release_smoke_acceptance.py \
            scripts/run_historical_workbench_release_smoke.py
      - name: CLI import smoke
        run: python scripts/run_historical_workbench_release_smoke.py --help
      - name: Dependency consistency
        run: python -m pip check

  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workspace/package-lock.json
      - name: Install frontend
        working-directory: workspace
        run: npm ci
      - name: Type check
        working-directory: workspace
        run: npm run typecheck
      - name: Production build
        working-directory: workspace
        run: npm run build
      - name: Install Chromium
        working-directory: workspace
        run: npx playwright install --with-deps chromium
      - name: No-alpha UX contract
        working-directory: workspace
        run: npx playwright test e2e/historical-release-smoke.spec.ts
      - name: Real smoke remains opt-in
        working-directory: workspace
        run: npx playwright test e2e/historical-release-smoke-real.spec.ts
