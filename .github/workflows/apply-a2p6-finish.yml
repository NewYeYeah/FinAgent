name: apply-a2p6-finish

on:
  push:
    branches:
      - a2p6-robust-research-program

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2p6-robust-research-program
          fetch-depth: 0
      - name: Apply A2.6 integration transformations
        run: |
          python tools/apply_a2p6_finish.py
          python -m py_compile \
            src/finagent/research/ashare_robust_program.py \
            src/finagent/research/factor_feedback_v3.py \
            src/finagent/research/__init__.py \
            scripts/run_local_ashare_robust_research.py \
            tests/test_ashare_robust_research_a26.py
      - name: Commit finished sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/apply_a2p6_finish.py .github/workflows/apply-a2p6-finish.yml
          git add src scripts tests .github/workflows/tests.yml
          git commit -m "research: integrate A2.6 robust program surfaces"
          git push origin HEAD:a2p6-robust-research-program
