name: mt5-p0-readonly

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/brokers/**"
      - "scripts/probe_mt5_readonly.py"
      - "tests/test_mt5_p0_*.py"
      - "docs/status.toml"
      - "docs/guides/mt5-readonly-probe.md"
      - ".github/workflows/mt5-p0-readonly.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/brokers/**"
      - "scripts/probe_mt5_readonly.py"
      - "tests/test_mt5_p0_*.py"
      - "docs/status.toml"
      - "docs/guides/mt5-readonly-probe.md"
      - ".github/workflows/mt5-p0-readonly.yml"

permissions:
  contents: read

jobs:
  readonly-probe:
    name: MT5-P0 read-only capability contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Read-only probe and acceptance regression
        run: uv run --frozen pytest -q tests/test_mt5_p0_readonly_probe.py tests/test_mt5_p0_acceptance.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/brokers \
            scripts/probe_mt5_readonly.py \
            tests/test_mt5_p0_readonly_probe.py \
            tests/test_mt5_p0_acceptance.py
          uv run --frozen mypy --strict src/finagent/brokers/mt5
          uv run --frozen python -m py_compile \
            src/finagent/brokers/__init__.py \
            src/finagent/brokers/mt5/*.py \
            scripts/probe_mt5_readonly.py
