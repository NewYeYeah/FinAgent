name: workbench2-strategy-empty-state-fix

on:
  push:
    branches: [codex/workbench2-linked-strategy-analytics]
    paths:
      - ".github/workflows/workbench2-strategy-empty-state-fix.yml"

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/workbench2-linked-strategy-analytics
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workspace/package-lock.json
      - name: Apply empty-state fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("workspace/src/workbench/strategy.tsx")
          text = path.read_text(encoding="utf-8")
          old = '{decisionsQuery.isPending ? <LoadingState /> : decisionsQuery.error ? <ErrorState error={decisionsQuery.error} /> : rows.length ? ('
          new = '{decisionsQuery.isLoading ? <LoadingState /> : decisionsQuery.error ? <ErrorState error={decisionsQuery.error} /> : rows.length ? ('
          if text.count(old) != 1:
              raise SystemExit(f"expected one decisions loading guard, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install frontend
        working-directory: workspace
        run: npm ci
      - name: Targeted unit and build validation
        working-directory: workspace
        run: |
          npm run typecheck
          npm test -- src/workbench/strategy.test.tsx src/workbench/linkedStrategy.test.tsx
          npm run build
      - name: Install Chromium
        working-directory: workspace
        run: npx playwright install --with-deps chromium
      - name: Historical and linked browser validation
        working-directory: workspace
        run: npx playwright test e2e/historical-release-smoke.spec.ts e2e/linked-strategy-analytics.spec.ts
      - name: Diff validation
        run: git diff --check
      - name: Commit validated product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/src/workbench/strategy.tsx
          git commit -m "fix(workbench): preserve empty strategy evidence state"
          git push origin HEAD:codex/workbench2-linked-strategy-analytics
