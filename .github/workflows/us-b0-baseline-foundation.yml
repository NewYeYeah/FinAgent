name: us-b0-baseline-foundation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/us_baselines.py"
      - "src/finagent/research/us_baseline_evaluation.py"
      - "src/finagent/research/us_baseline_materialization.py"
      - "scripts/materialize_us_b0_baselines.py"
      - "tests/test_us_b0_baseline_contracts.py"
      - "tests/test_us_b0_evaluation_core.py"
      - "tests/test_us_b0_materialization.py"
      - "tests/test_us_b0_turnover_determinism.py"
      - "docs/guides/us-b0-baselines.md"
      - ".github/workflows/us-b0-baseline-foundation.yml"
  push:
    branches: [main]
    paths:
      - "src/finagent/research/us_baselines.py"
      - "src/finagent/research/us_baseline_evaluation.py"
      - "src/finagent/research/us_baseline_materialization.py"
      - "scripts/materialize_us_b0_baselines.py"
      - "tests/test_us_b0_baseline_contracts.py"
      - "tests/test_us_b0_evaluation_core.py"
      - "tests/test_us_b0_materialization.py"
      - "tests/test_us_b0_turnover_determinism.py"
      - "docs/guides/us-b0-baselines.md"
      - ".github/workflows/us-b0-baseline-foundation.yml"

permissions:
  contents: read

jobs:
  us-b0-baseline-foundation:
    name: US-B0 deterministic baseline foundation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Baseline contract regression
        run: |
          uv run --frozen pytest -q \
            tests/test_us_b0_baseline_contracts.py \
            tests/test_us_b0_evaluation_core.py \
            tests/test_us_b0_materialization.py \
            tests/test_us_b0_turnover_determinism.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/research/us_baselines.py \
            src/finagent/research/us_baseline_evaluation.py \
            src/finagent/research/us_baseline_materialization.py \
            scripts/materialize_us_b0_baselines.py \
            tests/test_us_b0_baseline_contracts.py \
            tests/test_us_b0_evaluation_core.py \
            tests/test_us_b0_materialization.py \
            tests/test_us_b0_turnover_determinism.py
          uv run --frozen mypy --strict \
            src/finagent/research/us_baselines.py \
            src/finagent/research/us_baseline_evaluation.py \
            src/finagent/research/us_baseline_materialization.py \
            scripts/materialize_us_b0_baselines.py
          uv run --frozen python -m py_compile \
            src/finagent/research/us_baselines.py \
            src/finagent/research/us_baseline_evaluation.py \
            src/finagent/research/us_baseline_materialization.py \
            scripts/materialize_us_b0_baselines.py
