name: workbench2-apply-integration

on:
  push:
    branches:
      - codex/workbench2-experiments-graph
    paths:
      - scripts/_workbench2_experiments_graph_patch.py
      - .github/workflows/workbench2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/workbench2-experiments-graph
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded integration edits
        run: python scripts/_workbench2_experiments_graph_patch.py
      - name: Remove temporary patch machinery
        run: rm scripts/_workbench2_experiments_graph_patch.py .github/workflows/workbench2-apply.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(workbench): integrate experiments and research graph"
          git push origin HEAD:codex/workbench2-experiments-graph
