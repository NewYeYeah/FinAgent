name: us-r2-frozen-protocol

on:
  pull_request:
    branches: [main]
    paths:
      - "src/finagent/research/us_r2_frozen_protocol.py"
      - "scripts/freeze_us_r2_protocol.py"
      - "tests/test_us_r2_frozen_protocol.py"
      - "docs/guides/us-r2-frozen-protocol.md"
      - ".github/workflows/us-r2-frozen-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-protocol:
    name: US-R2 inventory-bound protocol freeze
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical uv resolver
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Reproduce locked development environment
        run: uv sync --frozen --extra dev
      - name: Frozen protocol regression
        run: uv run --frozen pytest -q tests/test_us_r2_frozen_protocol.py
      - name: Strict static checks
        run: |
          uv run --frozen ruff check \
            src/finagent/research/us_r2_frozen_protocol.py \
            scripts/freeze_us_r2_protocol.py \
            tests/test_us_r2_frozen_protocol.py
          uv run --frozen mypy --strict \
            src/finagent/research/us_r2_frozen_protocol.py \
            scripts/freeze_us_r2_protocol.py
          uv run --frozen python -m py_compile \
            src/finagent/research/us_r2_frozen_protocol.py \
            scripts/freeze_us_r2_protocol.py
