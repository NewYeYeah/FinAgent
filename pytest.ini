[pytest]
testpaths =
    tests

pythonpath =
    src

# FinAgent is not a ROS2 package.
# External pytest plugins from /opt/ros/* must not be loaded.
# The canonical invocation is scripts/run_tests.sh, which delegates to scripts/finagent.sh.
addopts =
    -p no:launch_testing
    -p no:launch_testing_ros
    -p no:ament_flake8
    -p no:ament_pep257
    -p no:ament_copyright
    -p no:ament_xmllint
