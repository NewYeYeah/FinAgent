[local_ashare_factor_research]
mode = "deterministic"
root = "D:/Data/A-Share"
frozen_manifest = "data/manifests/local_ashare_daily.json"
supplement_root = "reference_data/a_share"
state_dir = ".finagent/local-ashare-factor-a2"
report_path = "reports/local_ashare_factor_research_a2.json"

# The fixed candidate universe is selected using only data observed before development.
universe_selection_date = 2017-12-29
universe_top_n = 150
min_universe_size = 100
include_bse = false
selection_min_listed_days = 250
selection_min_close = 1.0
selection_min_amount_cny = 10000000.0
selection_exclude_st = true

# Adaptive development, independent validation and an untouched future reserve.
development_start = 2018-01-01
development_end_exclusive = 2022-01-01
validation_start = 2022-01-01
validation_end_exclusive = 2025-01-01
reserve_start = 2025-01-01
reserve_end_exclusive = 2026-08-22

approved_input_fields = [
  "simple_return_1",
  "simple_return_5",
  "simple_return_20",
  "squared_log_return_1",
  "log_volume_change_1",
  "log_volume_change_5",
  "turnover_rate",
  "circ_mv",
  "listed_days",
]
primary_label = "forward_simple_return_1"
decay_labels = ["forward_simple_return_5"]

# PIT research-universe policy applied at every panel session.
policy_min_listed_days = 120
policy_exclude_st = true
policy_min_close = 1.0
policy_min_median_amount_cny = 5000000.0
policy_liquidity_lookback = 20
policy_min_liquidity_observations = 10
# Hidden pre-split history initializes rolling liquidity without exposing it as evidence.
policy_liquidity_warmup_calendar_days = 120

# Factor Quant v2 and deterministic ensemble selection.
quantiles = 5
min_cross_section = 50
min_periods = 250
annualization = 252.0
winsor_lower_quantile = 0.01
winsor_upper_quantile = 0.99
ensemble_max_factors = 3
ensemble_max_abs_factor_correlation = 0.85
ensemble_quality_metric = "rank_icir"
ensemble_min_abs_quality = 0.0
ensemble_quality_power = 1.0
sandbox_batch_size = 512
smoke_lookback = 64

# A2.5 stability and dependence-aware inference. These values are part of the report identity.
stability_rolling_window = 63
stability_rolling_step = 21
stability_min_rolling_periods = 20
stability_hac_lags = 5
stability_bootstrap_samples = 500
stability_bootstrap_block_length = 20
stability_bootstrap_seed = 20260827

# Research verdict. System completion remains separate and A2 is never promotion-eligible.
verdict_min_validation_rank_icir = 0.0
verdict_min_validation_long_short_sharpe = 0.0
verdict_max_hac_pvalue = 0.05
verdict_max_bootstrap_pvalue = 0.05

# Used only when mode = "agent".
task_id = "local-ashare-factor-a2"
research_question = "Discover complementary, economically interpretable A-share daily cross-sectional factors using only approved PIT market inputs."
llm_config_path = "configs/llm.toml"
llm_profile = "deepseek_official_v4_pro"
llm_model = ""
agent_rounds = 2
candidates_per_round = 3
max_total_candidates = 6
max_feature_lookback = 60
# DeepSeek V4-Pro high-thinking calls observed in A2 can exceed 10k completion tokens.
# The cap is a ceiling, not a target; actual usage remains provider-reported usage.
max_output_tokens = 50000
# One logical candidate can self-repair schema/AST/sandbox conformance failures.
candidate_repair_attempts = 3
# If all repair attempts fail, a bounded replacement is generated for the same slot.
candidate_replacement_attempts = 2

[[local_ashare_factor_research.baseline_factors]]
feature_id = "a2-momentum-20"
name = "Twenty-session momentum"
description = "Raw twenty-session adjustment-aware return."
hypothesis = "Medium-horizon price continuation contains cross-sectional information."
input_fields = ["simple_return_20"]
lookback = 1
source = """
def compute_feature(inputs):
    return [None if value is None else value for value in inputs["simple_return_20"]]
"""

[[local_ashare_factor_research.baseline_factors]]
feature_id = "a2-reversal-5"
name = "Five-session reversal"
description = "Negative five-session adjustment-aware return."
hypothesis = "Short-horizon overreaction mean-reverts in the next session."
input_fields = ["simple_return_5"]
lookback = 1
source = """
def compute_feature(inputs):
    return [None if value is None else -value for value in inputs["simple_return_5"]]
"""

[[local_ashare_factor_research.baseline_factors]]
feature_id = "a2-volume-confirmed-momentum"
name = "Volume-confirmed momentum"
description = "Five-session return scaled by contemporaneous volume change."
hypothesis = "Price continuation is stronger when accompanied by expanding activity."
input_fields = ["simple_return_5", "log_volume_change_5"]
lookback = 1
source = """
def compute_feature(inputs):
    returns = inputs["simple_return_5"]
    volume = inputs["log_volume_change_5"]
    return [None if r is None or v is None else r * (1.0 + v) for r, v in zip(returns, volume)]
"""

[[local_ashare_factor_research.baseline_factors]]
feature_id = "a2-low-realized-variance"
name = "Low realized variance"
description = "Negative trailing mean squared one-session log return."
hypothesis = "Lower recent idiosyncratic volatility is associated with stronger risk-adjusted cross-sectional returns."
input_fields = ["squared_log_return_1"]
lookback = 20
source = """
def compute_feature(inputs):
    values = inputs["squared_log_return_1"]
    return [None if i < 19 or any(value is None for value in values[i - 19:i + 1]) else -sum(values[i - 19:i + 1]) / 20.0 for i in range(len(values))]
"""

[[local_ashare_factor_research.baseline_factors]]
feature_id = "a2-small-size"
name = "Small-size exposure"
description = "Negative logarithm of circulating market capitalization."
hypothesis = "Smaller liquid A-share firms may earn a cross-sectional size premium."
input_fields = ["circ_mv"]
lookback = 1
source = """
def compute_feature(inputs):
    return [None if value is None or value <= 0 else -math.log(value) for value in inputs["circ_mv"]]
"""
