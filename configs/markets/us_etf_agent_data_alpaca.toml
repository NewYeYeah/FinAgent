[market]
provider = "alpaca"
market_data_config_path = "configs/market_data.toml"
market_data_profile = "alpaca_primary"
region = "us_equity"
asset_type = "etf"
symbols = ["SPY", "QQQ", "IWM", "DIA"]
start = 2018-01-01
end = 2026-08-24
adjustment = "raw"
# SIP is the canonical historical research feed. IEX is retained only for smoke
# configurations because single-exchange coverage can create calendar/volume gaps.
feed = "sip"
output_dir = "data/market/us_etf_alpaca"

[market.venue_overrides]
SPY = "ARCX"
QQQ = "XNAS"
IWM = "ARCX"
DIA = "ARCX"

[market.metadata]
purpose = "primary immutable US ETF dataset for Agent market research"
provider_role = "primary"
