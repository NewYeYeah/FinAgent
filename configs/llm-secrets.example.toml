# Copy this template OUTSIDE the repository, for example:
#   Linux/macOS: ~/.config/finagent/secrets.toml
#   Windows:     %USERPROFILE%\.config\finagent\secrets.toml
#
# Never commit the populated secret file. On POSIX systems run:
#   chmod 600 ~/.config/finagent/secrets.toml

[api_keys]
deepseek_official = "REPLACE_WITH_DEEPSEEK_API_KEY"
siliconflow = "REPLACE_WITH_SILICONFLOW_API_KEY"
openai = "REPLACE_WITH_OPENAI_API_KEY"
