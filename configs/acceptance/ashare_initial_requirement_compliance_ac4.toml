[audit]
name = "FinAgent A-share Historical v1.0 initial requirement compliance"

[[requirements]]
id = "pit_data_adapter_research_dataset"
requirement = "PIT DataAdapter / ResearchDataset numerical contract"
source_plan = ["docs/development/current-development-plan-v2.md", "docs/development/current-development-plan-v4.0.md"]
implementation = ["src/finagent/ports.py", "src/finagent/domain/research.py", "src/finagent/data/local_ashare_adapter.py"]
test_evidence = ["tests/test_data_adapter_phase1.py", "tests/test_numerical_data_contract.py", "tests/test_local_ashare_data_layer_v126.py"]
status = "PASS"
disposition = "close in Historical v1.0"
rationale = "Point-in-time dataset, explicit split and local frozen A-share adapter contracts are implemented and regression-tested."

[[requirements]]
id = "agent_research_framework"
requirement = "Bounded Agent research and generated-feature framework"
source_plan = ["docs/development/current-development-plan-v2.md"]
implementation = ["src/finagent/agents/llm_feature.py", "src/finagent/research/factor_discovery.py", "src/finagent/research/resilient_candidate_generator.py"]
test_evidence = ["tests/test_agent_factor_discovery_v123.py", "tests/test_agent_generation_robustness_observability.py", "tests/test_phase3d_feature_generation.py"]
status = "PASS"
disposition = "close in Historical v1.0"
rationale = "Generated code is bounded by schema/AST/sandbox rules, repair/replacement is bounded, and validation/reserve evidence is excluded from Agent feedback."

[[requirements]]
id = "robust_factor_a2p6"
requirement = "Robust Factor / A2.6 research program"
source_plan = ["docs/development/current-development-plan-v2.md", "docs/development/current-development-plan-v4.0.md"]
implementation = ["src/finagent/research/ashare_robust_program.py", "src/finagent/application/ashare_research_workflows.py"]
test_evidence = ["tests/test_ashare_robust_research_a26.py", "tests/test_ashare_factor_acceptance_a2.py"]
status = "PASS"
disposition = "close in Historical v1.0"
rationale = "Immutable program identity, expanding walk-forward, multiplicity-aware gate, exact replay and explicit no-alpha terminal state are implemented."

[[requirements]]
id = "a3_ashare_execution_semantics"
requirement = "A3 A-share execution semantics"
source_plan = ["docs/development/current-development-plan-v2.md"]
implementation = ["src/finagent/domain/ashare_execution.py", "src/finagent/data/ashare_execution.py", "src/finagent/services/ashare_execution.py"]
test_evidence = ["tests/test_ashare_execution_a3.py", "tests/test_ashare_execution_edge_cases_a3.py", "tests/test_ashare_suspension_session_semantics_v127.py"]
status = "PASS"
disposition = "close in Historical v1.0"
rationale = "T+1 inventory, board quantity rules, suspension/price-limit tradeability, fee and cash semantics are isolated and tested as A-share-specific behavior."

[[requirements]]
id = "a4_execution_aware_portfolio"
requirement = "A4 execution-aware historical portfolio validation"
source_plan = ["docs/development/current-development-plan-v2.md", "docs/development/current-development-plan-v4.0.md"]
implementation = ["src/finagent/backtest/ashare_portfolio.py", "src/finagent/application/ashare_portfolio_workflow.py"]
test_evidence = ["tests/test_ashare_portfolio_validation_a4.py", "tests/test_phase4_portfolio_research.py"]
status = "PASS"
disposition = "close in Historical v1.0"
rationale = "Frozen A2.6 factors feed execution-aware long-only portfolio validation with gross/net ledgers, costs, risk estimates and replayable economic evidence."

[[requirements]]
id = "immutable_evidence_identity_replay"
requirement = "Immutable evidence, content identity and exact replay"
source_plan = ["docs/development/current-development-plan-v2.md", "docs/development/current-development-plan-v3.1.md"]
implementation = ["src/finagent/operations/evidence.py", "src/finagent/backtest/strategy_decision_series.py", "src/finagent/research/factor_series.py"]
test_evidence = ["tests/test_strategy_decision_series_v40.py", "tests/test_factor_series_v41.py", "tests/test_ashare_portfolio_validation_a4.py"]
status = "PASS"
disposition = "close in Historical v1.0"
rationale = "Core research and analytical series use immutable identities/digests and fail closed on binding or replay mismatch."

[[requirements]]
id = "a5_one_shot_infrastructure"
requirement = "A5 one-shot reserve infrastructure"
source_plan = ["docs/development/current-development-plan-v2.md", "docs/development/current-development-plan-v4.0.md"]
implementation = ["src/finagent/research/ashare_reserve.py", "src/finagent/research/ashare_reserve_runner.py", "src/finagent/research/ashare_reserve_lifecycle.py"]
test_evidence = ["tests/test_ashare_reserve_eligibility_a5.py", "tests/test_ashare_reserve_runner_a5.py", "tests/test_ashare_reserve_lifecycle_a5.py"]
status = "PASS"
disposition = "close infrastructure requirement; do not consume production reserve for Historical v1.0"
rationale = "Eligibility seal, one-shot runner, durable pre-access CONSUMED claim, crash recovery and replay audit are implemented; real reserve use remains separately human-authorized."

