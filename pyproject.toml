[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent"
version = "0.0.1"
description = "Typed domain kernel for an auditable quantitative research and portfolio agent system."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "FinAgent contributors"},
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
