[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent"
version = "0.3.0rc1"
description = "Auditable quantitative research, portfolio construction and agent infrastructure."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "FinAgent contributors"},
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]
llm-openai = [
  "openai>=3.2,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
