[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent"
version = "1.2.2"
description = "Auditable agentic quantitative research, deterministic portfolio construction and supervised paper/shadow operations."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "FinAgent contributors"},
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
  "build>=1.2,<2",
  "duckdb>=1.4,<2",
  # The full project pytest suite collects Workspace API tests. Keep the
  # read-only API test dependencies in dev so `pip install -e .[dev]` is a
  # complete test environment rather than failing during collection.
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
]
llm = [
  "openai>=3.2,<4",
]
# Backward-compatible alias. The OpenAI SDK is also used as the transport for
# DeepSeek and SiliconFlow OpenAI-compatible endpoints.
llm-openai = [
  "openai>=3.2,<4",
]
a-share = [
  "tushare>=1.4.29,<2",
]
cn-free = [
  "akshare>=1.17,<2",
]
us-market = [
  "alpaca-py>=0.44,<1",
]
local-parquet = [
  "duckdb>=1.4,<2",
]
# Vendor-neutral OTLP exporter used by the optional Agent trace UI integration.
# Phoenix itself is run as a separate local service (`pip install arize-phoenix`).
observability = [
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
# Legacy read-only A2/A2.5 diagnostic viewer.
visualization = [
  "streamlit>=1.45,<2",
  "plotly>=5.24,<7",
]
# Read-only V1 Evidence API. The React/TypeScript application is installed with npm
# from workspace/package-lock.json and served by this FastAPI surface after build.
workspace = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# FinAgent tests do not depend on the optional Phoenix pytest plugin. Blocking it
# here prevents incompatible user-environment Phoenix installs from crashing
# before pytest can collect FinAgent tests.
addopts = "-q -p no:phoenix"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
