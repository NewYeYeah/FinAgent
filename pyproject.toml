[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent"
version = "1.2.2"
description = "Auditable agentic quantitative research, deterministic portfolio construction and supervised paper/shadow operations."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "FinAgent contributors"},
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
  "build>=1.2,<2",
  "duckdb>=1.4,<2",
]
llm = [
  "openai>=3.2,<4",
]
# Backward-compatible alias. The OpenAI SDK is also used as the transport for
# DeepSeek and SiliconFlow OpenAI-compatible endpoints.
llm-openai = [
  "openai>=3.2,<4",
]
a-share = [
  "tushare>=1.4.29,<2",
]
cn-free = [
  "akshare>=1.17,<2",
]
us-market = [
  "alpaca-py>=0.44,<1",
]
local-parquet = [
  "duckdb>=1.4,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
